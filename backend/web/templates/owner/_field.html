{% if kind == 'bool' %}<input type="checkbox" name="{{ name }}" {% if value %}checked{% endif %} aria-label="{{ label }}">{% elif kind == 'num' %}<input name="{{ name }}" value="{{ value }}" inputmode="decimal" class="short" aria-label="{{ label }}">{% else %}<input name="{{ name }}" value="{{ value }}" aria-label="{{ label }}">{% endif %}
