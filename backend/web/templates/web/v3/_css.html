<style>
@font-face{font-family:"Inter3";font-style:normal;font-weight:400;font-display:swap;src:url({{ font_in.w400 }}) format("woff2");unicode-range:U+0000-00FF,U+2013-2026,U+20AC,U+2122,U+2190-2192,U+2713}
@font-face{font-family:"Inter3";font-style:normal;font-weight:600;font-display:swap;src:url({{ font_in.w600 }}) format("woff2");unicode-range:U+0000-00FF,U+2013-2026,U+20AC,U+2122,U+2190-2192,U+2713}
@font-face{font-family:"Inter3";font-style:normal;font-weight:700 800;font-display:swap;src:url({{ font_in.w700 }}) format("woff2");unicode-range:U+0000-00FF,U+2013-2026,U+20AC,U+2122,U+2190-2192,U+2713}
@font-face{font-family:"Bangla3";font-style:normal;font-weight:400 800;font-display:swap;src:url({{ font_bn }}) format("woff2");unicode-range:U+0951-0952,U+0964-0965,U+0980-09FE,U+1CD0-1CF7,U+200C-200D,U+25CC}
:root{
  --navy:#0B1020;--navy2:#111833;--ink-on-navy:#EEF1FA;--ink2-on-navy:#B4BCD6;
  --bg:#FFFFFF;--bg2:#F5F6FA;--card:#FFFFFF;--ink:#0B1020;--ink2:#475069;--line:#E3E6EE;
  --acc:#4338CA;--acc2:#0F766E;--link:#3730A3;
  --grad:linear-gradient(135deg,#4F46E5 0%,#0F766E 100%);
  --grad-soft:linear-gradient(135deg,rgba(79,70,229,.10),rgba(15,118,110,.10));
  --soonbg:#EEF0F5;--soonink:#4A5168;
  --shadow:0 1px 2px rgba(11,16,32,.05),0 12px 32px -12px rgba(11,16,32,.18);
  --r:18px;--maxw:1160px;
  --font:"Inter3","Bangla3",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070A14;--bg2:#0C1120;--card:#10172B;--ink:#E9ECF5;--ink2:#A6AECA;--line:#1D2541;
  --acc:#A5B4FC;--acc2:#5EEAD4;--link:#C7D2FE;--soonbg:#1A2138;--soonink:#B9C0D8;
  --grad-soft:linear-gradient(135deg,rgba(99,102,241,.16),rgba(20,184,166,.12));
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
:lang(bn) body,html:lang(bn) body{line-height:1.75}
a{color:var(--link);text-underline-offset:3px}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;letter-spacing:-.015em}
html:lang(bn) h1,html:lang(bn) h2,html:lang(bn) h3{letter-spacing:0;line-height:1.4}
p{margin:0 0 1em}
:focus-visible{outline:3px solid #818CF8;outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.mut{color:var(--ink2)}
.skip{position:absolute;left:-9999px;top:8px;z-index:30;background:#fff;color:#0B1020;padding:10px 16px;border-radius:10px}
.skip:focus{left:12px}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.pv{background:#FDE68A;color:#3B2F00;text-align:center;font-size:14px;padding:8px 16px;font-weight:600}
/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.86);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid rgba(255,255,255,.08);color:var(--ink-on-navy)}
.hd-in{display:flex;align-items:center;gap:12px;min-height:64px}
.logo{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700;font-size:19px;min-height:48px}
.logo img{width:32px;height:32px;border-radius:9px}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav a,.dd summary{color:var(--ink2-on-navy);text-decoration:none;font-size:15px;font-weight:500;padding:10px 12px;border-radius:10px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.nav a:hover,.dd summary:hover{color:#fff;background:rgba(255,255,255,.07)}
.dd{position:relative}
.dd summary{cursor:pointer;list-style:none}
.dd summary::-webkit-details-marker{display:none}
.dd summary .i{transform:rotate(90deg);transition:transform .2s}
.dd[open] summary .i{transform:rotate(-90deg)}
.dd-p{position:absolute;right:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));background:#121A33;border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:8px;box-shadow:0 24px 60px -12px rgba(0,0,0,.6);display:grid;gap:2px}
@media (min-width:821px){.dd-p{left:0;right:auto}}
.dd-p a{color:#E3E8F7;padding:10px 12px;border-radius:10px;gap:12px;width:100%}
.dd-p a .i{color:#A5B4FC}
.dd-p .dd-all{color:#C7D2FE;font-weight:600;border-top:1px solid rgba(255,255,255,.08);border-radius:0 0 10px 10px;margin-top:4px}
.dd-m{display:none}
.lang{border:1px solid rgba(255,255,255,.22);color:#fff!important;font-weight:600!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;background:var(--grad);color:#fff!important;font-weight:600;text-decoration:none;border:0;box-shadow:0 8px 24px -10px rgba(79,70,229,.7)}
.btn:hover{filter:brightness(1.08)}
.btn.sm{min-height:44px;padding:8px 16px;font-size:14px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.28);box-shadow:none}
@media (max-width:820px){.nl,.play-top{display:none!important}.dd-m{display:grid;border-top:1px solid rgba(255,255,255,.08);margin-top:4px;padding-top:4px}}
/* hero */
.hero{background:radial-gradient(1200px 600px at 85% -10%,rgba(79,70,229,.35),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(15,118,110,.30),transparent 60%),var(--navy);color:var(--ink-on-navy);padding:56px 0 64px;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#C7D2FE;background:rgba(99,102,241,.16);border:1px solid rgba(165,180,252,.28);padding:6px 12px;border-radius:999px;margin-bottom:20px}
.kick .dot{width:8px;height:8px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 0 4px rgba(94,234,212,.18)}
.hero h1{font-size:clamp(32px,5.2vw,58px);font-weight:800;margin-bottom:20px;color:#fff}
html:lang(bn) .hero h1{font-size:clamp(28px,4.4vw,48px)}
.hero h1 .g{background:linear-gradient(90deg,#A5B4FC,#5EEAD4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:clamp(17px,1.8vw,20px);color:var(--ink2-on-navy);max-width:640px;margin-bottom:28px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.badge{display:inline-block;border-radius:10px}
.badge img{width:200px;height:auto}
.hero .note{font-size:14px;color:#9BA4C2;margin-top:18px}
.hero-shot{justify-self:center}
/* phone frame (CSS only, around a REAL app screenshot) */
.ph{position:relative;width:min(300px,72vw);aspect-ratio:9/20;border-radius:38px;padding:10px;background:linear-gradient(160deg,#2A3354,#0E1428);box-shadow:0 40px 80px -30px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.12)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:29px;background:#fff}
.ph.s{width:min(260px,66vw)}
/* sections */
.sec{padding:80px 0}
.sec.alt{background:var(--bg2)}
.eyebrow{display:block;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
html:lang(bn) .eyebrow{letter-spacing:0;text-transform:none}
.sec h2{font-size:clamp(28px,3.6vw,42px);font-weight:800}
.h1s{font-size:clamp(32px,4.4vw,52px);font-weight:800}
.lead{font-size:19px;color:var(--ink2);max-width:720px}
/* auto strip */
.autos{background:var(--navy2);color:var(--ink-on-navy);padding:28px 0;border-top:1px solid rgba(255,255,255,.06)}
.autos h2{font-size:15px;font-weight:600;color:#C7D2FE;margin:0 0 14px;letter-spacing:0}
.auto-l{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;list-style:none;margin:0;padding:0}
.auto-l li{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;font-size:15px;line-height:1.5}
.auto-l b{display:block;color:#fff;font-weight:600}
.auto-l span.t{color:#B4BCD6}
.ab{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:1;color:#fff;background:var(--grad);padding:6px 9px;border-radius:999px;white-space:nowrap;flex:none}
.ab::before{content:"";width:6px;height:6px;border-radius:50%;background:#A7F3D0}
.soon{display:inline-flex;font-size:12px;font-weight:700;line-height:1;color:var(--soonink);background:var(--soonbg);padding:6px 9px;border-radius:999px;white-space:nowrap;flex:none}
/* what is */
.what{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--grad-soft);color:var(--acc);margin-bottom:16px}
.card h3,.sec .card h2{font-size:19px;font-weight:700}
.sec .sub-h{font-size:22px}
.card p{color:var(--ink2);font-size:16px;margin:0}
/* groups grid */
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:40px}
.gc{display:flex;flex-direction:column}
.gc h3,.gc .h3{font-size:22px;display:flex;align-items:center;gap:12px}
.gc h3 a,.gc .h3 a{color:inherit;text-decoration:none}
.gc h3 a:hover{text-decoration:underline}
.gc ul{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:10px}
.gc li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5}
.gc li .i{color:var(--acc);margin-top:1px;width:20px;height:20px}
.gc li em{font-style:normal;color:var(--ink2)}
.more{margin-top:auto;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:44px}
/* feature rows (group pages) */
.ghead{background:var(--navy);color:var(--ink-on-navy);padding:48px 0 44px}
.ghead h1{font-size:clamp(30px,4.4vw,50px);font-weight:800;color:#fff;display:flex;gap:14px;align-items:center}
.ghead h1 .ic{margin:0;background:rgba(99,102,241,.2);color:#A5B4FC}
.ghead .lead{color:var(--ink2-on-navy)}
.crumb{font-size:14px;margin-bottom:14px}
.crumb a{color:#C7D2FE}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding:0;list-style:none}
.toc a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#E3E8F7;text-decoration:none;font-size:14px}
.toc a:hover{background:rgba(255,255,255,.08)}
.frow{display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:center;padding:56px 0;border-bottom:1px solid var(--line)}
.frow:nth-child(even){grid-template-columns:300px 1fr}
.frow:nth-child(even) .ft-txt{order:2}
.frow h2{font-size:clamp(24px,2.8vw,34px);font-weight:800}
.frow .body{font-size:18px;color:var(--ink2);max-width:560px}
.autoln{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-weight:600;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.fc h3{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fc .ic{width:40px;height:40px;border-radius:12px;margin-bottom:12px}
.fc .autoln{font-size:14px;margin-bottom:8px}
.fc.is-soon{box-shadow:none;background:transparent;border-style:dashed}
.sub-h{font-size:22px;margin-top:56px}
.gnav{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:40px 0}
.gnav a{display:inline-flex;flex-direction:column;min-height:48px;text-decoration:none;font-weight:700;font-size:18px}
.gnav small{color:var(--ink2);font-weight:500;font-size:14px}
/* pricing */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:36px}
.plan h3,.sec .plan h2{font-size:20px}
.price{font-size:34px;font-weight:800;margin:6px 0 12px;letter-spacing:-.02em}
.price small{font-size:15px;font-weight:500;color:var(--ink2)}
.plan ul,.cctv ul{padding-left:20px;margin:0;color:var(--ink2);font-size:15px}
.plan li,.cctv li{margin:4px 0}
.cctv{margin-top:24px;border-style:dashed;box-shadow:none}
.cctv h3,.cctv h2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* trust */
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:36px}
.never{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:20px 0 0}
.never li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px}
/* faq */
.faq{max-width:820px;margin-top:28px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;font-weight:600;font-size:18px;padding:18px 36px 18px 0;list-style:none;position:relative;min-height:48px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:6px;top:14px;font-size:24px;color:var(--acc)}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--ink2);padding-bottom:16px}
/* end cta + footer */
.cta-end{background:var(--navy);color:var(--ink-on-navy);text-align:center;padding:72px 0}
.cta-end h2{font-size:clamp(28px,3.6vw,40px);color:#fff}
.cta-end p{color:var(--ink2-on-navy);font-size:18px}
.cta-end .badge{margin-top:8px}
.ft{background:#060912;color:#AEB6CF;padding:56px 0 28px;font-size:15px}
.ft a{color:#D5DBEE;text-decoration:none}
.ft a:hover{text-decoration:underline}
.ft .mut{color:#98A1BD}
.ft-in{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px}
.ft-h{font-size:14px;color:#fff;margin-bottom:10px}
.ft ul{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.ft li a{display:inline-flex;min-height:36px;align-items:center}
.ft-bot{border-top:1px solid rgba(255,255,255,.08);margin-top:36px;padding-top:20px;font-size:14px}
/* motion (JS adds .in; without JS or with reduced motion nothing moves) */
.js:not(.rm) .rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.js:not(.rm) .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.js .rv{opacity:1!important;transform:none!important;transition:none!important}}
/* responsive */
@media (max-width:980px){.what{grid-template-columns:repeat(2,1fr)}.auto-l{grid-template-columns:repeat(2,1fr)}.trust{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:repeat(2,1fr)}.ft-in{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  body{font-size:16px}
  .hero{padding:36px 0 48px}.hero-in{grid-template-columns:1fr;gap:36px}
  .sec{padding:56px 0}.lead{font-size:17px}
  .groups,.what,.auto-l,.trust,.fgrid{grid-template-columns:1fr}
  .frow,.frow:nth-child(even){grid-template-columns:1fr;gap:28px;padding:40px 0}
  .frow:nth-child(even) .ft-txt{order:0}
  .frow .ph{justify-self:center}
  .frow .body{font-size:17px}
  .ft-in{grid-template-columns:1fr}
}
</style>
