<style>
@font-face{font-family:"Taka3";font-style:normal;font-weight:400 800;font-display:swap;src:url({{ font_taka }}) format("woff2");unicode-range:U+09F3}
@font-face{font-family:"Inter3";font-style:normal;font-weight:400;font-display:optional;src:url({{ font_in.w400 }}) format("woff2");unicode-range:U+0000-00FF,U+2013-2026,U+20AC,U+2122,U+2190-2192,U+2713}
@font-face{font-family:"Inter3";font-style:normal;font-weight:600;font-display:optional;src:url({{ font_in.w600 }}) format("woff2");unicode-range:U+0000-00FF,U+2013-2026,U+20AC,U+2122,U+2190-2192,U+2713}
@font-face{font-family:"Inter3";font-style:normal;font-weight:700 800;font-display:optional;src:url({{ font_in.w700 }}) format("woff2");unicode-range:U+0000-00FF,U+2013-2026,U+20AC,U+2122,U+2190-2192,U+2713}
@font-face{font-family:"Bangla3";font-style:normal;font-weight:400 800;font-display:optional;src:url({{ font_bn }}) format("woff2");unicode-range:U+0951-0952,U+0964-0965,U+0980-09FE,U+1CD0-1CF7,U+200C-200D,U+25CC}
:root{
  --navy:#0B1020;--navy2:#111833;--ink-on-navy:#EEF1FA;--ink2-on-navy:#B4BCD6;
  --bg:#FFFFFF;--bg2:#F5F6FA;--card:#FFFFFF;--ink:#0B1020;--ink2:#475069;--line:#E3E6EE;
  --acc:#4338CA;--acc2:#0F766E;--link:#3730A3;
  --grad:linear-gradient(135deg,#4F46E5 0%,#0F766E 100%);
  --grad-soft:linear-gradient(135deg,rgba(79,70,229,.10),rgba(15,118,110,.10));
  --soonbg:#EEF0F5;--soonink:#4A5168;
  --shadow:0 1px 2px rgba(11,16,32,.05),0 12px 32px -12px rgba(11,16,32,.18);
  --r:18px;--maxw:1160px;
  --font:"Taka3","Inter3","Bangla3",system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070A14;--bg2:#0C1120;--card:#10172B;--ink:#E9ECF5;--ink2:#A6AECA;--line:#1D2541;
  --acc:#A5B4FC;--acc2:#5EEAD4;--link:#C7D2FE;--soonbg:#1A2138;--soonink:#B9C0D8;
  --grad-soft:linear-gradient(135deg,rgba(99,102,241,.16),rgba(20,184,166,.12));
  --shadow:0 1px 2px rgba(0,0,0,.5),0 16px 40px -16px rgba(0,0,0,.7);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:132px}
@media (min-width:821px){html{scroll-padding-top:88px}}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
:lang(bn) body,html:lang(bn) body{line-height:1.75}
a{color:var(--link);text-underline-offset:3px}
img{max-width:100%;height:auto;display:block}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;letter-spacing:-.015em}
html:lang(bn) h1,html:lang(bn) h2,html:lang(bn) h3{letter-spacing:0;line-height:1.4}
p{margin:0 0 1em}
:focus-visible{outline:3px solid #818CF8;outline-offset:3px;border-radius:8px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.mut{color:var(--ink2)}
.skip{position:absolute;left:-9999px;top:8px;z-index:30;background:#fff;color:#0B1020;padding:10px 16px;border-radius:10px}
.skip:focus{left:12px}
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.pv{background:#FDE68A;color:#3B2F00;text-align:center;font-size:14px;padding:8px 16px;font-weight:600}
/* header */
.hd{position:sticky;top:0;z-index:20;background:rgba(11,16,32,.86);backdrop-filter:saturate(1.5) blur(14px);-webkit-backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid rgba(255,255,255,.08);color:var(--ink-on-navy)}
.hd-in{display:flex;align-items:center;gap:12px;min-height:64px}
.logo{display:inline-flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700;font-size:19px;min-height:48px}
.logo img{width:32px;height:32px;border-radius:9px}
.lang{flex:none;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.lang:hover{background:rgba(255,255,255,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;background:var(--grad);color:#fff!important;font-weight:600;text-decoration:none;border:0;box-shadow:0 8px 24px -10px rgba(79,70,229,.7)}
.btn:hover{filter:brightness(1.08)}
.btn.sm{min-height:44px;padding:8px 16px;font-size:14px}
.btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.28);box-shadow:none}
/* spacing scale 4-8-12-16-24-32-48-64-96 */
:root{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;--s9:96px}
/* sitefix (owner 3 Nov 11:10) header: ONE compact sticky row on desktop —
   logo | chip links | Install now + language. Phones: logo, language, menu
   button; the chips scroll in a second row. */
.hd .chips{flex:1;min-width:0}
.chips-in{position:relative;display:flex;gap:6px;padding:6px 0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 24px),transparent 100%)}
.chips-in::-webkit-scrollbar{display:none}
.chips a{flex:none;scroll-snap-align:center;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;color:#D5DBEE;text-decoration:none;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,.14);transition:background .2s,color .2s,border-color .2s}
.chips a:hover{background:rgba(255,255,255,.08);color:#fff}
.chips a.on{background:#EEF1FA;color:#0B1020;border-color:#EEF1FA}
.play-top{flex:none}
.burger{display:none;width:48px;height:48px;place-content:center;gap:5px;border-radius:12px;flex:none}
.burger span{display:block;width:22px;height:2px;border-radius:2px;background:#fff}
@media (min-width:821px){
  .chips-in{-webkit-mask-image:none;mask-image:none}
  .chips-in>a:first-child{margin-left:auto}.chips-in>a:last-child{margin-right:auto}
  .chips a[data-play],.chips a[href="#download"]{display:none}  /* Install now sits on the right */
}
@media (max-width:820px){
  .hd-in{flex-wrap:wrap;gap:0 8px;min-height:0;padding-top:6px}
  .hd .chips{order:9;flex:0 0 calc(100% + 40px);margin:0 -20px}
  .chips-in{padding:2px 20px 8px}
  .chips a{min-height:44px;padding:0 16px;font-size:15px}
  .play-top{display:none}
  .lang{margin-left:auto}
  .burger{display:grid}
}
/* full-screen mobile menu: a sibling of the header (never inside its
   backdrop-filter, which would shrink a position:fixed panel to the header) */
.mm{display:none;position:fixed;inset:0;z-index:60;background:#0B1020;color:#EEF1FA;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  padding:env(safe-area-inset-top,0px) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.mm:target,.mm-open .mm{display:flex}
@media (min-width:821px){.mm,.mm:target,.mm-open .mm{display:none}}
.mm-top{display:flex;align-items:center;justify-content:space-between;min-height:64px;flex:none}
.mm-x{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;color:#fff;border:1px solid rgba(255,255,255,.2)}
.mm-p{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.mm-p a{display:flex;align-items:center;gap:14px;min-height:52px;padding:6px 14px;border-radius:12px;color:#EEF1FA;text-decoration:none;font-size:18px;font-weight:600;line-height:1.3}
.mm-p a .i{color:#A5B4FC}
.mm-p a:hover{background:rgba(255,255,255,.06)}
.mm-p a.on{background:rgba(94,234,212,.14);color:#5EEAD4}
.mm-p a.on .i{color:#5EEAD4}
.mm-get{margin-top:auto;padding-top:24px;display:grid;gap:6px;justify-items:center;flex:none}
.mm-get .install{width:100%}
.mm-apk{display:inline-flex;align-items:center;min-height:44px;font-size:14px;color:#C7D2FE}
.mm-open,.mm-open body{overflow:hidden}
.pbar{display:none}
.totop{position:fixed;right:16px;bottom:24px;z-index:15;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s}
.totop .i{transform:rotate(-90deg)}
.totop.show{opacity:1;pointer-events:auto;transform:none}
@media (max-width:820px){
  .pbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:16;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(11,16,32,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08)}
  /* owner 3 Nov: the bar appears only once the hero Install button has
     scrolled out of view (base.html script); fixed + transform = no layout
     shift; without JS it is always shown */
  .js .pbar:not(.show){transform:translateY(110%);visibility:hidden}
  .pbar{transition:transform .25s ease,visibility .25s}
  body{padding-bottom:88px}
  .totop{bottom:100px}}
/* hero screens (sitefix, owner 3 Nov 11:10): ONE screen at a time on
   phones and desktop — a clipped viewport + a sliding track (base.html
   script); off-screen slides are hidden, so two screens never overlap. */
.hero-ph{width:min(300px,82vw);margin:0 auto}
.rot-vp{overflow:hidden;touch-action:pan-y}
.track{display:flex;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.drag .track{transition:none}
.slide{flex:0 0 100%;min-width:0;display:block;cursor:zoom-in;visibility:hidden;transition:visibility 0s .45s;-webkit-user-select:none;user-select:none}
.slide.on,.drag .slide{visibility:visible;transition:none}
.slide img{width:100%;height:auto;aspect-ratio:auto 360/800;border-radius:12px;background:#151C35;-webkit-user-drag:none}
.rot-cap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;gap:2px;margin:12px 0 0;min-height:64px;font-size:15px;line-height:1.4;font-weight:600;color:#EEF1FA}
.rot-n{font-size:13px;font-weight:500;color:#B4BCD6}
.dots{display:flex;justify-content:center;align-items:center;margin-top:2px}
.dot{width:26px;height:44px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);transition:width .25s,background .25s}
.dot.on::before{width:20px;border-radius:5px;background:#5EEAD4}
.rot-btn{width:44px;height:44px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:#1A2347;color:#fff;display:grid;place-items:center;cursor:pointer;margin-left:6px}
.rot-btn .ic-play,.rot-btn[aria-pressed="true"] .ic-pause{display:none}
.rot-btn[aria-pressed="true"] .ic-play{display:block}
@media (min-width:761px){
  .hero-ph{width:300px}
  .rot-fr{position:relative;padding:30px 12px 34px;border-radius:44px;background:linear-gradient(160deg,#2A3354,#0E1428);box-shadow:0 40px 80px -30px rgba(0,0,0,.65),inset 0 0 0 1px rgba(255,255,255,.12)}
  .rot-fr::before{content:"";position:absolute;top:12px;left:50%;width:56px;height:6px;margin-left:-28px;border-radius:6px;background:rgba(255,255,255,.18)}
  .slide img{border-radius:10px}
}
/* full-screen screenshot viewer (native <dialog>: focus trap, Esc, back) */
.zv{border:0;padding:0;margin:0;width:100vw;height:100vh;max-width:100vw;max-height:100vh;background:rgba(5,8,16,.96);color:#fff}
.zv::backdrop{background:rgba(5,8,16,.9)}
.zv img{display:block;max-width:min(94vw,540px);max-height:calc(100vh - 96px);width:auto;height:auto;margin:72px auto 0;border-radius:12px}
.zv-x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:#151C35;color:#fff;font-size:26px;line-height:1;cursor:pointer}
/* get the app: Install (primary) + Play badge; APK = small secondary link */
.get{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.get .badge img{width:160px;height:auto}
.install{min-height:52px;padding:12px 28px;font-size:17px}
.soon-line{font-size:14px;color:#C7D2FE;margin:10px 0 0}
.apk{font-size:13px;color:#9BA4C2;margin:8px 0 0;line-height:1.6}
.apk a{color:#C7D2FE}
.apk code{font-size:12px;word-break:break-all;color:#B4BCD6}
.cta-end .get{justify-content:center}
.mm-get{margin-top:var(--s4)}
.mm-get .install{width:100%}
.pbar .get{flex-wrap:nowrap;gap:10px}
.pbar .badge img{width:120px}
.pbar .install{flex:1;min-height:48px;padding:10px 14px;font-size:16px}
.more-l{color:#C7D2FE}
/* hover states */
.card{transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
a.card:hover,.gc:hover,.fc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
@media (prefers-reduced-motion:reduce){.pbar,.card,.chips a,.burger span,.totop,.hero-ph img,.track{transition:none!important}.gc:hover,.fc:hover{transform:none}}
/* hero */
.hero{background:radial-gradient(1200px 600px at 85% -10%,rgba(79,70,229,.35),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(15,118,110,.30),transparent 60%),var(--navy);color:var(--ink-on-navy);padding:48px 0 64px;overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:start}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#C7D2FE;background:rgba(99,102,241,.16);border:1px solid rgba(165,180,252,.28);padding:6px 12px;border-radius:999px;margin-bottom:20px}
.kick .dot{width:8px;height:8px;border-radius:50%;background:#5EEAD4;box-shadow:0 0 0 4px rgba(94,234,212,.18)}
.hero h1{font-size:clamp(32px,5.2vw,58px);font-weight:800;margin-bottom:20px;color:#fff}
html:lang(bn) .hero h1{font-size:clamp(28px,4.4vw,48px)}
.hero h1 .g{background:linear-gradient(90deg,#A5B4FC,#5EEAD4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1{margin-bottom:12px}
.hero .slogan{font-size:clamp(20px,2.4vw,28px);font-weight:700;color:#fff;margin:0 0 14px;letter-spacing:-.01em}
.hero .sub{font-size:clamp(17px,1.8vw,20px);color:var(--ink2-on-navy);max-width:640px;margin-bottom:28px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.badge{display:inline-block;border-radius:10px}
.badge img{width:200px;height:auto}
.hero .note{font-size:14px;color:#9BA4C2;margin-top:18px}
.hero-shot{justify-self:center}
/* screenshots: never cropped or squeezed (natural aspect, height:auto).
   MOBILE: no frame — plain screenshot, small radius + soft shadow, ~80% wide.
   DESKTOP: a frame whose INNER screen rect has safe padding, so the frame's
   round corners never sit over the screenshot (owner bug 3 Nov 01:35). */
.ph{display:block;position:relative;width:min(80vw,340px);margin:0 auto;border-radius:12px;box-shadow:0 18px 40px -18px rgba(11,16,32,.45),0 2px 6px rgba(11,16,32,.12);cursor:zoom-in}
.ph img{width:100%;height:auto;border-radius:12px;background:#fff}
@media (min-width:761px){
  .ph{width:300px;padding:30px 12px 34px;border-radius:44px;background:linear-gradient(160deg,#2A3354,#0E1428);box-shadow:0 40px 80px -30px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.12)}
  .ph::before{content:"";position:absolute;top:12px;left:50%;width:56px;height:6px;margin-left:-28px;border-radius:6px;background:rgba(255,255,255,.18)}
  .ph img{border-radius:10px}
}
/* sections */
.sec{padding:80px 0}
.sec.alt{background:var(--bg2)}
.eyebrow{display:block;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
html:lang(bn) .eyebrow{letter-spacing:0;text-transform:none}
.sec h2{font-size:clamp(28px,3.6vw,42px);font-weight:800}
.h1s{font-size:clamp(32px,4.4vw,52px);font-weight:800}
.lead{font-size:19px;color:var(--ink2);max-width:720px}
/* auto strip */
.autos{background:var(--navy2);color:var(--ink-on-navy);padding:28px 0;border-top:1px solid rgba(255,255,255,.06)}
.autos h2{font-size:15px;font-weight:600;color:#C7D2FE;margin:0 0 14px;letter-spacing:0}
.auto-l{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;list-style:none;margin:0;padding:0}
.auto-l li{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;font-size:15px;line-height:1.5}
.auto-l b{display:block;color:#fff;font-weight:600}
.auto-l span.t{color:#B4BCD6}
.ab{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:1;color:#fff;background:var(--grad);padding:6px 9px;border-radius:999px;white-space:nowrap;flex:none}
.ab::before{content:"";width:6px;height:6px;border-radius:50%;background:#A7F3D0}
.soon{display:inline-flex;font-size:12px;font-weight:700;line-height:1;color:var(--soonink);background:var(--soonbg);padding:6px 9px;border-radius:999px;white-space:nowrap;flex:none}
/* what is */
.what{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--grad-soft);color:var(--acc);margin-bottom:16px}
.card h3,.sec .card h2{font-size:19px;font-weight:700}
.sec .sub-h{font-size:22px}
.card p{color:var(--ink2);font-size:16px;margin:0}
/* groups grid */
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:40px}
.gc{display:flex;flex-direction:column}
.gc h3,.gc .h3{font-size:22px;display:flex;align-items:center;gap:12px}
.gc h3 a,.gc .h3 a{color:inherit;text-decoration:none}
.gc h3 a:hover{text-decoration:underline}
.gc ul{list-style:none;padding:0;margin:14px 0 18px;display:grid;gap:10px}
.gc li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5}
.gc li .i{color:var(--acc);margin-top:1px;width:20px;height:20px}
.gc li em{font-style:normal;color:var(--ink2)}
.more{margin-top:auto;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:44px}
/* feature rows (group pages) */
.ghead{background:var(--navy);color:var(--ink-on-navy);padding:48px 0 44px}
.ghead h1{font-size:clamp(30px,4.4vw,50px);font-weight:800;color:#fff;display:flex;gap:14px;align-items:center}
.ghead h1 .ic{margin:0;background:rgba(99,102,241,.2);color:#A5B4FC}
.ghead .lead{color:var(--ink2-on-navy)}
.crumb{font-size:14px;margin-bottom:14px}
.crumb a{color:#C7D2FE}
.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding:0;list-style:none}
.toc a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);color:#E3E8F7;text-decoration:none;font-size:14px}
.toc a:hover{background:rgba(255,255,255,.08)}
.frow{display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:center;padding:56px 0;border-bottom:1px solid var(--line)}
.frow:nth-child(even){grid-template-columns:300px 1fr}
.frow:nth-child(even) .ft-txt{order:2}
.frow h2{font-size:clamp(24px,2.8vw,34px);font-weight:800}
.frow .body{font-size:18px;color:var(--ink2);max-width:560px}
.autoln{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px;font-weight:600;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.fc h3{font-size:18px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fc .ic{width:40px;height:40px;border-radius:12px;margin-bottom:12px}
.fc .autoln{font-size:14px;margin-bottom:8px}
