{% load site %}{% site_copy lang as C %}<meta property="og:site_name" content="Assisto">
<meta property="og:type" content="{{ og_type|default:'website' }}">
<meta property="og:title" content="{{ og_title|default:C.og_title_default }}">
<meta property="og:description" content="{{ og_desc|default:C.meta_desc }}">
<meta property="og:url" content="{% site_url %}{{ request.get_full_path }}">
<meta property="og:image" content="{% if lang == 'en' %}{% site_abs_asset 'og-en.jpg' %}{% else %}{% site_abs_asset 'og-bn.jpg' %}{% endif %}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ C.og_image_alt }}">
<meta property="og:locale" content="{% if lang == 'en' %}en_US{% else %}bn_BD{% endif %}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title|default:C.og_title_default }}">
<meta name="twitter:description" content="{{ og_desc|default:C.meta_desc }}">
<meta name="twitter:image" content="{% if lang == 'en' %}{% site_abs_asset 'og-en.jpg' %}{% else %}{% site_abs_asset 'og-bn.jpg' %}{% endif %}">
