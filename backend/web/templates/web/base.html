<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Assisto{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
{% block og %}
<meta property="og:title" content="Assisto — জীবন আপনি চালান, মনে রাখার দায়িত্ব আমার">
<meta property="og:description" content="ফ্রি বাংলা টুল: CV স্কোর, স্ক্যাম চেকার, পাসপোর্ট ছবি, উৎসবের কার্ড।">
<meta property="og:type" content="website">
{% endblock %}
<style>
  :root{--navy:#0A1A3D;--navy2:#14336E;--teal:#0E7C66;--gold:#E7A32E;--cyan:#1E9BD6;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans Bengali',system-ui,sans-serif;background:#f4f6fb;color:#16203a;line-height:1.6}
  a{color:var(--teal);text-decoration:none}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:18px 16px;text-align:center}
  header .brand{font-weight:800;font-size:22px;letter-spacing:.3px}
  header .tag{font-size:13px;opacity:.85;margin-top:2px}
  .wrap{max-width:620px;margin:0 auto;padding:16px}
  .card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 2px 12px rgba(10,26,61,.07)}
  .tool{display:flex;gap:14px;align-items:center}
  .tool .emoji{font-size:34px}
  .tool h3{margin:0;font-size:18px}
  .tool p{margin:2px 0 0;font-size:13px;color:#5a6680}
  h1{font-size:22px;margin:.2em 0}
  h2{font-size:19px}
  textarea,input[type=text],select,input[type=file]{width:100%;padding:12px;border:1px solid #cdd5e5;border-radius:10px;font-family:inherit;font-size:15px;background:#fff}
  textarea{min-height:170px;resize:vertical}
  label{font-weight:600;font-size:14px;display:block;margin:12px 0 6px}
  .btn{display:inline-block;background:var(--teal);color:#fff;padding:13px 20px;border:none;border-radius:12px;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;width:100%;text-align:center}
  .btn.gold{background:var(--gold)}
  .btn.ghost{background:#eef2fb;color:var(--navy)}
  .btn.sm{width:auto;padding:10px 14px;font-size:14px}
  .err{background:#ffe9e9;color:#a11;padding:10px 12px;border-radius:10px;font-size:14px}
  .score{font-size:72px;font-weight:800;color:var(--cyan);text-align:center;line-height:1}
  .muted{color:#5a6680;font-size:13px}
  .bar{height:10px;background:#e7ecf6;border-radius:6px;overflow:hidden;margin-top:4px}
  .bar > i{display:block;height:100%;background:var(--teal)}
  .share{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .share a{flex:1;min-width:120px;text-align:center;padding:11px;border-radius:10px;color:#fff;font-weight:600;font-size:14px}
  .fb{background:#1877f2}.wa{background:#25d366}.dl{background:var(--navy)}
  .pill{display:inline-block;background:#eef2fb;border-radius:20px;padding:4px 12px;font-size:12px;margin:3px 2px}
  .warn{background:#fff4d6;border:1px solid #f0d58a;border-radius:12px;padding:12px;font-size:14px}
  ul{padding-left:20px}
  footer{text-align:center;padding:24px 16px;color:#8591ab;font-size:12px}
  .appcta{background:linear-gradient(135deg,var(--teal),#0b5e4e);color:#fff;border-radius:16px;padding:16px;text-align:center;margin:16px 0}
  .appcta a{color:#fff;font-weight:700;text-decoration:underline}
  img.result{max-width:100%;border-radius:12px;border:1px solid #dde3ef}
</style>
</head>
<body>
<header>
  <a href="/" style="color:#fff"><div class="brand">Assisto</div></a>
  <div class="tag">জীবন আপনি চালান, মনে রাখার দায়িত্ব আমার</div>
</header>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<footer>
  <div>Assisto · AXON ERP Software</div>
  <div style="margin-top:6px"><a href="/get">📱 পুরো সুবিধা চাইলে অ্যাপ নিন</a></div>
</footer>
</body>
</html>
