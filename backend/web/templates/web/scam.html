{% extends "web/base.html" %}
{% block title %}{{ T.scam_h }} — Assisto{% endblock %}
{% block content %}
<h1>{{ T.scam_h }}</h1>
<p class="muted">{{ T.scam_lead }}</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" class="card">
  {% csrf_token %}
  <label>{{ T.scam_paste }}</label>
  <textarea name="message" placeholder="{% if lang == 'en' %}e.g. You won 50,000 BDT, share your PIN...{% else %}যেমন: আপনি ৫০,০০০ টাকা জিতেছেন, PIN দিন...{% endif %}"></textarea>
  <div style="height:12px"></div>
  <button class="btn" type="submit">{{ T.scam_btn }}</button>
</form>
{% endblock %}
