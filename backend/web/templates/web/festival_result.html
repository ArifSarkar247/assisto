{% extends "web/base.html" %}
{% block title %}{{ title }} — Assisto{% endblock %}
{% block og %}
<meta property="og:title" content="{{ title }} — Assisto">
<meta property="og:description" content="{% if lang == 'en' %}Make a free festival card on Assisto.{% else %}ফ্রি উৎসবের কার্ড বানান Assisto-তে।{% endif %}">
<meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}/festival/card.png?{{ q }}">
{% endblock %}
{% block content %}
<div class="card" style="text-align:center">
  <h2>{{ title }}</h2>
  <img class="result" src="/festival/card.png?{{ q }}" alt="card">
  <div class="share" style="margin-top:12px">
    <a class="fb" href="https://www.facebook.com/sharer/sharer.php?u={{ request.scheme }}://{{ request.get_host }}/festival/card.png?{{ q }}" target="_blank">Facebook</a>
    <a class="wa" href="https://wa.me/?text={{ request.scheme }}://{{ request.get_host }}/festival/card.png?{{ q }}" target="_blank">WhatsApp</a>
    <a class="dl" href="/festival/card.png?{{ q }}" download="assisto-card.png">{{ T.download_card }}</a>
  </div>
  <div style="margin-top:8px"><a class="muted" href="/festival/card.png?{{ q }}&story=1" download>{{ T.story_card }}</a></div>
</div>
<div class="appcta"><a href="/get{{ qlang }}">{{ T.fest_cta }}</a></div>
<p style="text-align:center"><a href="/festival{{ qlang }}">{{ T.again }}</a></p>
{% endblock %}
