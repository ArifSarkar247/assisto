{% extends "web/base.html" %}
{% block title %}{{ T.fest_h }} — Assisto{% endblock %}
{% block content %}
<h1>{{ T.fest_h }}</h1>
<p class="muted">{{ T.fest_lead }}</p>
<form method="post" class="card">
  {% csrf_token %}
  <label>{{ T.fest_select }}</label>
  <select name="festival">
    {% for key, title, sub in festivals %}<option value="{{ key }}">{{ title }} — {{ sub }}</option>{% endfor %}
  </select>
  <label>{{ T.fest_name }}</label>
  <input type="text" name="name" maxlength="40" placeholder="{% if lang == 'en' %}e.g. Rahim{% else %}যেমন: রহিম{% endif %}">
  <label>{{ T.fest_msg }}</label>
  <input type="text" name="message" maxlength="120" placeholder="{% if lang == 'en' %}e.g. Warm wishes to all{% else %}যেমন: সবাইকে শুভেচ্ছা{% endif %}">
  <div style="height:12px"></div>
  <button class="btn gold" type="submit">{{ T.fest_btn }}</button>
</form>
{% endblock %}
