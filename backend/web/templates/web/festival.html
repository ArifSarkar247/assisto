{% extends "web/base.html" %}
{% block title %}উৎসবের কার্ড — Assisto{% endblock %}
{% block content %}
<h1>🎉 উৎসবের শুভেচ্ছা কার্ড</h1>
<p class="muted">উৎসব বেছে নিন, নাম লিখুন — সুন্দর কার্ড বানিয়ে দেব। ফেসবুক/হোয়াটসঅ্যাপে শেয়ার করুন।</p>
<form method="post" class="card">
  {% csrf_token %}
  <label>উৎসব</label>
  <select name="festival">
    {% for key, f in festivals.items %}<option value="{{ key }}">{{ f.title }} — {{ f.sub }}</option>{% endfor %}
  </select>
  <label>আপনার নাম (ঐচ্ছিক)</label>
  <input type="text" name="name" maxlength="40" placeholder="যেমন: আরিফ">
  <label>বার্তা (ঐচ্ছিক)</label>
  <input type="text" name="message" maxlength="120" placeholder="যেমন: সবাইকে শুভেচ্ছা">
  <div style="height:12px"></div>
  <button class="btn gold" type="submit">কার্ড বানান</button>
</form>
{% endblock %}
