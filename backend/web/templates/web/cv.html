{% extends "web/base.html" %}
{% block title %}CV স্কোর — Assisto{% endblock %}
{% block content %}
<h1>📄 CV স্কোর</h1>
<p class="muted">আপনার CV-র লেখা পেস্ট করুন। আমরা ১০০-তে স্কোর ও ৫টি উন্নতির পরামর্শ দেব। ডাটা সেভ করা হয় না।</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" enctype="multipart/form-data" class="card">
  {% csrf_token %}
  <label>CV টেক্সট পেস্ট করুন</label>
  <textarea name="cv_text" placeholder="আপনার CV এখানে পেস্ট করুন..."></textarea>
  <label>অথবা .txt ফাইল দিন (ঐচ্ছিক)</label>
  <input type="file" name="cv_file" accept=".txt">
  <div style="height:12px"></div>
  <button class="btn" type="submit">স্কোর দেখুন</button>
</form>
{% endblock %}
