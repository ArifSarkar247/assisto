{% extends "web/base.html" %}
{% block title %}{{ T.cv_h }} — Assisto{% endblock %}
{% block content %}
<h1>{{ T.cv_h }}</h1>
<p class="muted">{{ T.cv_lead }}</p>
<p class="muted"><i>{{ T.cv_disclaimer }}</i></p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" enctype="multipart/form-data" class="card">
  {% csrf_token %}
  <label>{{ T.cv_paste }}</label>
  <textarea name="cv_text" placeholder="{{ T.cv_paste }}..."></textarea>
  <label>{{ T.cv_file }}</label>
  <input type="file" name="cv_file" accept=".txt">
  <div style="height:12px"></div>
  <button class="btn" type="submit">{{ T.cv_btn }}</button>
</form>
{% endblock %}
