{% extends "web/base.html" %}
{% block title %}আপনার ছবি তৈরি — Assisto{% endblock %}
{% block content %}
<div class="card" style="text-align:center">
  <h2>{{ label }}</h2>
  <img class="result" src="data:image/jpeg;base64,{{ img }}" style="max-height:360px" alt="ছবি">
  <div class="share" style="margin-top:12px">
    <a class="dl" href="data:image/jpeg;base64,{{ img }}" download="assisto-photo.jpg">ছবি ডাউনলোড</a>
    <a class="dl" style="background:var(--teal)" href="data:image/jpeg;base64,{{ sheet }}" download="assisto-print-sheet.jpg">প্রিন্ট শিট (৪ কপি)</a>
  </div>
</div>
<div class="appcta"><a href="/get">📱 আরও সুবিধা — অ্যাপ নিন</a></div>
<p style="text-align:center"><a href="/photo">↺ আরেকটা ছবি বানান</a></p>
{% endblock %}
