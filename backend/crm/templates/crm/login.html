<!doctype html><html lang="{{ lang }}"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ t.app_name }} · {{ t.login }}</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(1200px 600px at 20% -10%,rgba(59,110,246,.18),transparent),
 radial-gradient(1000px 500px at 100% 110%,rgba(155,77,240,.18),transparent),#0a0c14;
 font-family:'Segoe UI',system-ui,'Noto Sans Bengali',sans-serif;color:#e9ecf2}
.box{background:#12151e;border:1px solid #242a3a;border-radius:16px;padding:28px;width:340px}
.brand{font-weight:800;font-size:22px;background:linear-gradient(90deg,#22d3ee,#3b6ef6,#9b4df0);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.tag{color:#9aa3b5;font-size:12px;margin-bottom:18px}
label{display:block;font-size:12px;color:#9aa3b5;margin:12px 0 4px}
input{width:100%;padding:10px;border-radius:9px;border:1px solid #242a3a;background:#0e1119;color:#e9ecf2}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:9px;font-weight:800;color:#fff;
 background:linear-gradient(90deg,#3b6ef6,#9b4df0);cursor:pointer}
.err{color:#ff9aa8;font-size:13px;margin-top:12px}
.lang{margin-top:16px;text-align:center;font-size:12px}.lang a{color:#22d3ee}
</style></head><body>
<form class="box" method="post">{% csrf_token %}
 <div class="brand">{{ t.app_name }}</div>
 <div class="tag">{{ t.tagline }}</div>
 <label>{{ t.username }}</label><input name="username" autofocus>
 <label>{{ t.password }}</label><input name="password" type="password">
 <button>{{ t.login }}</button>
 {% if error %}<div class="err">{{ error }}</div>{% endif %}
 <div class="lang"><a href="?lang={% if lang == 'bn' %}en{% else %}bn{% endif %}">{{ t.lang_toggle }}</a></div>
</form></body></html>
