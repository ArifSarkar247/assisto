# Assisto Map tiles (add inside the api.lifeassisto.com server block; reload nginx after `nginx -t`).
# PMTiles are read with HTTP Range requests; nginx serves ranges from static files natively.
location /maps/v1/ {
  alias /home/ubuntu/assisto/maptiles/current/;
  default_type application/octet-stream;
  types { application/json json; image/png png; application/x-protobuf pbf; }
  add_header Access-Control-Allow-Origin "*" always;
  add_header Access-Control-Expose-Headers "ETag, Content-Range, Content-Length" always;
  add_header Cache-Control "public, max-age=86400" always;
  etag on;
  sendfile on;
  tcp_nopush on;
  gzip off;                 # tiles are already compressed inside the archive
  limit_rate_after 50m;     # one phone cannot pull the whole country at full speed
  limit_rate 2m;
}
