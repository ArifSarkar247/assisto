# b3-group: LiveKit signalling (WebSocket + /rtc/validate) behind the
# existing TLS server block of api.lifeassisto.com. install.sh copies this to
# /etc/nginx/snippets/assisto-livekit.conf and adds ONE line
#     include /etc/nginx/snippets/assisto-livekit.conf;
# inside the `listen 443 ssl` server block of /etc/nginx/sites-available/assisto.
# Phones connect to wss://api.lifeassisto.com/livekit  (LIVEKIT_URL); the
# client appends /rtc, which arrives at LiveKit as /rtc (prefix stripped).
location /livekit/ {
    proxy_pass http://127.0.0.1:7880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # a call can last hours: never cut the signalling socket
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
