# Load-test front proxy (CI runner only) — same shape as the live box:
# nginx in front of gunicorn on 127.0.0.1:8700. Pinned with the SUT to 2 CPUs.
worker_processes 2;
worker_cpu_affinity 01 10;
worker_rlimit_nofile 65535;
pid /tmp/lt-nginx.pid;
error_log /tmp/lt-nginx-error.log warn;
events { worker_connections 20000; }
http {
  access_log off;
  client_body_temp_path /tmp/lt-nginx-body;
  proxy_temp_path /tmp/lt-nginx-proxy;
  fastcgi_temp_path /tmp/lt-nginx-fcgi;
  uwsgi_temp_path /tmp/lt-nginx-uwsgi;
  scgi_temp_path /tmp/lt-nginx-scgi;
  keepalive_timeout 30;
  server {
    listen 8080 backlog=8192;
    location / {
      proxy_pass http://127.0.0.1:8700;
      proxy_set_header Host 127.0.0.1;
      proxy_connect_timeout 10s;
      proxy_read_timeout 60s;
    }
  }
}
