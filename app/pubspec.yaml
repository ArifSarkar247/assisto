name: assisto
description: "Assisto — আপনার ব্যক্তিগত AI এজেন্ট"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  intl: any  # let flutter_localizations pin the compatible intl version
  provider: ^6.1.2
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  # Part A plugins (probe-validated to build together on release arm64)
  image_picker: ^1.1.2        # vault attachments: camera / gallery
  camera: ^0.12.0           # in-app camera (0.12 pulls camera_avfoundation 0.11, fixes iOS Swift)
  permission_handler: ^11.3.1 # camera/mic/photos permission flow + openAppSettings
  image_cropper: ^8.0.2       # crop + rotate in the capture/edit screen
  geolocator: ^13.0.1         # SOS GPS location
  # Stolen-while-unlocked protection (Section 8): class-3 (strong) biometric
  # used LAZILY only when gating a sensitive security action (SecurityGuard).
  # Never invoked at app launch; all calls try/catch so a device without
  # enrolled biometrics still works (falls back to the Assisto Security PIN).
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0      # Bangla/English voice input + #79 wake-phrase listen
  share_plus: ^10.0.2         # SOS share sheet / share-out
  # Anti-theft Batch 4 — DISPLAY-ONLY QR for the digital sale receipt token
  # (pure Dart, no native code / no camera). The buyer accepts by scanning the
  # QR with any app OR by pasting the token; Assisto adds NO scanner plugin.
  # Lazy: QrImageView is only built inside the Sell screen, never at launch.
  qr_flutter: ^4.1.0
  # #79 Hands-free Voice SOS — foreground service (persistent notification +
  # microphone FGS type) that keeps speech_to_text listening with the screen off
  # and fires the EXISTING SOS (api.journeySos) on the chosen wake phrase.
  flutter_foreground_task: ^11.0.0
  # #70 Smartwatch & fitness — bridges Android Health Connect natively (steps,
  # heart rate, sleep, active energy). No custom Kotlin needed for reads.
  health: ^13.3.1
  # #196 Home-screen widget — pushes next-reminder / today count to a native
  # AppWidgetProvider (see android_overlay/) and opens the app on tap.
  home_widget: ^0.7.0
  # a6 FCM push — key-gated by google-services.json (CI secret
  # GOOGLE_SERVICES_JSON_B64). Lazy init after first frame; the auto-init
  # FirebaseInitProvider is removed in the manifest (ColorOS history).
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  # CCTV Part 4 (a2-cctv): Shop Box LIVE VIEW over WebRTC — P2P first, TURN
  # relay fallback (relayed minutes cost credits). Media never touches our
  # server and is never recorded. LAZY: only the live-view screen and Shop Box
  # mode import it (deferred); nothing at app launch. Shared constraint with
  # a4-remote (see /home/ubuntu/wt/SHARED_DEPS.md).
  flutter_webrtc: ^1.6.2
  # workmanager REMOVED — its androidx.work startup ContentProvider crashed on
  # launch (ColorOS/Realme) and background exec is throttled there anyway.
  # Family alerts now poll on app open/resume (see AppState). FCM later.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/bg.png"
  adaptive_icon_foreground: "assets/icon/fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#05060A"
  image: assets/branding/new_logo.png
  android_12:
    color: "#05060A"
    image: assets/branding/new_logo.png
