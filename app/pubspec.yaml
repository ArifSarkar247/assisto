name: assisto
description: "Assisto — আপনার ব্যক্তিগত AI এজেন্ট"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  intl: any  # let flutter_localizations pin the compatible intl version
  provider: ^6.1.2
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  # Part A plugins (probe-validated to build together on release arm64)
  image_picker: ^1.1.2        # vault attachments: camera / gallery
  geolocator: ^13.0.1         # SOS GPS location
  speech_to_text: ^7.0.0      # Bangla/English voice input
  share_plus: ^10.0.2         # SOS share sheet / share-out
  workmanager: ^0.6.0         # family alert polling (no Firebase)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/bg.png"
  adaptive_icon_foreground: "assets/icon/fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0A1A3D"
  image: assets/branding/logo.png
  android_12:
    color: "#0A1A3D"
    image: assets/branding/logo.png
