name: assisto
description: "Assisto — আপনার ব্যক্তিগত AI এজেন্ট"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  # home native ad refresh timing (testable clock; already resolved)
  clock: ^1.1.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  intl: any  # let flutter_localizations pin the compatible intl version
  provider: ^6.1.2
  package_info_plus: ^8.0.2
  open_filex: ^4.5.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  url_launcher: ^6.3.0
  # Part A plugins (probe-validated to build together on release arm64)
  image_picker: ^1.1.2        # vault attachments: camera / gallery
  # ---- play-perm ---- direct pins only to switch image_picker to the Android
  # Photo Picker (no media permission; Play Photo & Video policy). See
  # lib/media/photo_picker_setup.dart.
  image_picker_android: 0.8.13+25
  image_picker_platform_interface: 2.11.2
  # ---- /play-perm ----
  camera: ^0.12.0           # in-app camera (0.12 pulls camera_avfoundation 0.11, fixes iOS Swift)
  # c1-contacts: read-only phonebook (MIT). Lazy: created only when the
  # Contacts screen opens; every call crash-guarded.
  flutter_contacts: 1.1.9+2
  permission_handler: ^11.3.1 # camera/mic/photos permission flow + openAppSettings
  image_cropper: ^8.0.2       # crop + rotate in the capture/edit screen
  geolocator: ^13.0.1         # SOS GPS location
  # Stolen-while-unlocked protection (Section 8): class-3 (strong) biometric
  # used LAZILY only when gating a sensitive security action (SecurityGuard).
  # Never invoked at app launch; all calls try/catch so a device without
  # enrolled biometrics still works (falls back to the Assisto Security PIN).
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0      # Bangla/English voice input + #79 wake-phrase listen
  share_plus: ^10.0.2         # SOS share sheet / share-out
  # Anti-theft Batch 4 — DISPLAY-ONLY QR for the digital sale receipt token
  # (pure Dart, no native code / no camera). The buyer accepts by scanning the
  # QR with any app OR by pasting the token; Assisto adds NO scanner plugin.
  # Lazy: QrImageView is only built inside the Sell screen, never at launch.
  qr_flutter: ^4.1.0
  # #79 Hands-free Voice SOS — foreground service (persistent notification +
  # microphone FGS type) that keeps speech_to_text listening with the screen off
  # and fires the EXISTING SOS (api.journeySos) on the chosen wake phrase.
  flutter_foreground_task: ^11.0.0
  # #70 Smartwatch & fitness — bridges Android Health Connect natively (steps,
  # heart rate, sleep, active energy). No custom Kotlin needed for reads.
  health: ^13.3.1
  # #196 Home-screen widget — pushes next-reminder / today count to a native
  # AppWidgetProvider (see android_overlay/) and opens the app on tap.
  home_widget: ^0.7.0
  # AdMob (owner 25 Oct) — Free plan only, allowlisted screens only, lazy
  # (MobileAds.initialize only after the first frame, consent done, Free
  # user). Google TEST unit ids until the server flag admob_real_ids is on.
  # The MobileAdsInitProvider is removed in the CI manifest patch.
  google_mobile_ads: 9.1.0
  # FCM push — key-gated by google-services.json (CI secret
  # GOOGLE_SERVICES_JSON_B64). Lazy init after first frame; the auto-init
  # FirebaseInitProvider is removed in the manifest (ColorOS history).
  firebase_core: 4.15.0
  firebase_messaging: 16.7.0
  # sc1 crash reporting — same FlutterFire release train as firebase_messaging
  # 16.7.0 (both 2026-09-14, firebase_core ^4.14.0). LAZY like push: only
  # touched after the first frame through lib/push/firebase_lazy.dart, and
  # collection is OFF until the user is signed in and past onboarding
  # (manifest meta-data firebase_crashlytics_collection_enabled=false).
  firebase_crashlytics: 5.4.0
  # sc1: device brand/model/Android version/ROM for crash reports (already in
  # the tree as a transitive dependency — pinned to the same version).
  device_info_plus: 12.4.0
  # CCTV Part 4 (a2-cctv): Shop Box LIVE VIEW over WebRTC — P2P first, TURN
  # relay fallback (relayed minutes cost credits). Media never touches our
  # server and is never recorded. LAZY: only the live-view screen and Shop Box
  # mode import it (deferred); nothing at app launch.
  flutter_webrtc: ^1.6.2
  # ---- pay1 ---- Google Play Billing (BSD-3-Clause, flutter/packages).
  # Exact pin. LAZY: only lib/payments/play_billing_impl.dart imports it, as a
  # DEFERRED library loaded on the first "Google Play" tap in the Play build
  # (AppConfig.playStore). The website APK never calls it; its manifest drops
  # the BILLING permission (android.yml, marked ---- pay1 ----).
  in_app_purchase: 3.3.1
  # Android side pinned too (>= 2 weeks old; Play Billing Library inside).
  in_app_purchase_android: 0.5.3
  # ---- /pay1 ----
  # ---- ota1 ---- Google Play In-App Updates, FLEXIBLE flow (MIT; Play Core
  # app-update inside). Exact pin, >= 2 weeks old. LAZY: only
  # lib/play_update_impl.dart imports it, as a DEFERRED library loaded ~15 s
  # after the first frame and ONLY in the Play build (AppConfig.playStore).
  # The website APK never calls it (it keeps its own updater.dart).
  in_app_update: 4.2.5
  # ---- /ota1 ----
  # ---- md1 ---- My Circle E2E media (see .phaseB/proposals/md1.md).
  # crypto: dart-lang (BSD-3), pure Dart, already in the tree transitively —
  # streaming SHA-256 of the ciphertext. Same version as the lock.
  crypto: 3.0.7
  # record (BSD-3, llfbandit): voice-note recording, AAC-LC .m4a via the
  # platform MediaCodec/MediaRecorder. LAZY: only the recorder sheet creates
  # an AudioRecorder, after the mic permission; no startup ContentProvider.
  record: 7.1.1
  # audioplayers (MIT, bluefireteam): inline voice-note playback (Android
  # MediaPlayer — no ExoPlayer). LAZY: one player, created on the first play
  # tap; no startup ContentProvider.
  audioplayers: 6.8.1
  # ---- /md1 ----
  # ---- mc-media2 ---- inline E2E VIDEO playback in My Circle chats
  # (BSD-3, flutter/packages; Android = media3 ExoPlayer). Exact pins, >= 2
  # weeks old. LAZY: only lib/messaging/media/video_player_impl.dart imports
  # it, as a DEFERRED library loaded on the first Play tap of a video; the
  # plugin registers no ContentProvider / initializer and needs no permission.
  video_player: 2.14.1
  video_player_android: 2.12.2
  # ---- /mc-media2 ----
  # workmanager REMOVED — its androidx.work startup ContentProvider crashed on
  # launch (ColorOS/Realme) and background exec is throttled there anyway.
  # Family alerts now poll on app open/resume (see AppState). FCM later.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # reality audit flows (app/integration_test, test_driver) — dev-only SDK pkgs
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  # f1-design: bundled OFL fonts (licences next to them in assets/fonts/).
  # Latin = Inter, Bangla = Noto Sans Bengali, static 400/500/600/700 subsets.
  # (assets/fonts/NotoSansBengali.ttf stays in the repo for the backend's
  # card renderer but is no longer bundled into the app.)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/bg.png"
  adaptive_icon_foreground: "assets/icon/fg.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"   # Android 13+ themed icon
  # fg.png/monochrome.png are already laid out on the full 108dp canvas (logo
  # sized to the circle mask) — the default 16% inset would shrink the A to
  # ~44% of the icon (owner: "too small on OPPO").
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter_native_splash:
  # Android 11 and older: the brand gradient + white logo (owner icon C)
  background_image: assets/branding/splash_bg.png
  image: assets/branding/splash_logo.png
  android_12:
    # Android 12+ masks the icon to a circle; white logo inside its safe circle
    color: "#0A9BD0"
    image: assets/branding/splash_logo.png
