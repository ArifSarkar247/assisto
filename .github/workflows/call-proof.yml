# A4 CALL PROOF: two real clients (Python aiortc) place, answer, talk 30 s and
# hang up a My Circle voice call against the LIVE server + LIVE TURN, from a
# GitHub runner (outside AWS). Runs: forced relay (TURN only) and direct.
# Results table (connect time, relay used, RTP packets both ways, hang-up
# latency, PASS/FAIL) goes to the job summary; any FAIL turns the job red.
# Secrets: CALL_PROOF_A_PHONE, CALL_PROOF_A_PASSWORD, CALL_PROOF_B_PHONE,
# CALL_PROOF_B_PASSWORD (two accepted My Circle contacts); optional
# CALL_PROOF_A_MEMBER_ID. Script: tools/callproof/call_proof.py.
name: Call proof

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: API base
        default: https://api.lifeassisto.com/api/v1
        required: true
      runs:
        description: Comma list of relay | direct | relay-tcp | relay-tls
        default: relay,direct
        required: true
      rounds:
        description: How many times to repeat the run list
        default: '1'
        required: true
      talk_seconds:
        description: Audio time per call
        default: '30'
        required: true
      shape:
        description: "callsbar: shape the runner's network (netem, both ways via ifb) — none | 3g | edge | lossy4g"
        default: none
        required: true

permissions:
  contents: read

concurrency:
  group: call-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install aiortc (pinned)
        run: |
          python -m pip install --upgrade pip==24.2
          pip install aiortc==1.9.0 aioice==0.10.2 av==12.3.0 requests==2.32.3
      # callsbar: a poor network like a Bangladeshi phone on a bad day. Both
      # directions are shaped (egress on eth0, ingress via ifb). Numbers:
      #   3g      300 kbit/s, 150 ms +-40, 2 % loss
      #   edge    120 kbit/s, 350 ms +-80, 5 % loss
      #   lossy4g 4 Mbit/s,    60 ms +-20, 15 % loss
      - name: Shape the network (${{ inputs.shape }})
        if: inputs.shape != 'none'
        run: |
          set -eu
          case "${{ inputs.shape }}" in
            3g) N="delay 150ms 40ms loss 2% rate 300kbit" ;;
            edge) N="delay 350ms 80ms loss 5% rate 120kbit" ;;
            lossy4g) N="delay 60ms 20ms loss 15% rate 4mbit" ;;
            *) echo "unknown shape"; exit 1 ;;
          esac
          DEV=$(ip route show default | awk '{print $5; exit}')
          sudo modprobe ifb numifbs=1 || true
          sudo ip link set dev ifb0 up
          sudo tc qdisc add dev "$DEV" root netem $N
          sudo tc qdisc add dev "$DEV" handle ffff: ingress
          sudo tc filter add dev "$DEV" parent ffff: protocol all u32 match u32 0 0 action mirred egress redirect dev ifb0
          sudo tc qdisc add dev ifb0 root netem $N
          tc qdisc show
          echo "### Network shaped: ${{ inputs.shape }} ($N, both ways)" >> "$GITHUB_STEP_SUMMARY"
      - name: Two-client call proof (live server + live TURN)
        env:
          API_BASE: ${{ inputs.api_base }}
          CALL_PROOF_RUNS: ${{ inputs.runs }}
          CALL_PROOF_ROUNDS: ${{ inputs.rounds }}
          CALL_PROOF_A_PHONE: ${{ secrets.CALL_PROOF_A_PHONE }}
          CALL_PROOF_A_PASSWORD: ${{ secrets.CALL_PROOF_A_PASSWORD }}
          CALL_PROOF_B_PHONE: ${{ secrets.CALL_PROOF_B_PHONE }}
          CALL_PROOF_B_PASSWORD: ${{ secrets.CALL_PROOF_B_PASSWORD }}
          CALL_PROOF_A_MEMBER_ID: ${{ secrets.CALL_PROOF_A_MEMBER_ID }}
          CALL_PROOF_TALK: ${{ inputs.talk_seconds }}
        run: python tools/callproof/call_proof.py
