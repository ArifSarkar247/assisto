name: Smoke test (emulator API 33)

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend base URL baked into the app"
        required: false
        default: "https://api.lifeassisto.com"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---- identical build setup to android.yml (minus signing), x86_64 so it
      #      runs on the emulator ----
      - name: Generate Android platform files
        working-directory: app
        run: flutter create --project-name assisto --org com.assisto --platforms=android .

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icons (adaptive)
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        working-directory: app
        run: dart run flutter_native_splash:create

      - name: Patch manifest (app name + permissions)
        working-directory: app
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace('android:label="assisto"', 'android:label="Assisto"')
          perms = (
              '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              '\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
              '\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              '\n    <uses-permission android:name="android.permission.CAMERA"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
          )
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, s, count=1)
          queries = (
              '\n    <queries>'
              '\n      <intent><action android:name="android.intent.action.DIAL"/>'
              '<data android:scheme="tel"/></intent>'
              '\n      <intent><action android:name="android.intent.action.SENDTO"/>'
              '<data android:scheme="smsto"/></intent>'
              '\n      <intent><action android:name="android.intent.action.VIEW"/></intent>'
              '\n    </queries>\n'
          )
          if '<queries>' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1' + queries, s, count=1)
          open(p, "w").write(s)
          print("manifest patched")
          PY

      - name: Enable core library desugaring + SDK levels
        working-directory: app
        run: |
          python3 - <<'PY'
          import os, re as _re
          kts = "android/app/build.gradle.kts"; gr = "android/app/build.gradle"
          p, is_kts = (kts, True) if os.path.exists(kts) else (gr, False)
          s = open(p).read()
          s = _re.sub(r'\n[ \t]*minSdk[A-Za-z]*\s*=?[^\n]*', '', s)
          s = s.replace('defaultConfig {', 'defaultConfig {' + ('\n        minSdk = 23' if is_kts else '\n        minSdkVersion 23'), 1)
          s = _re.sub(r'\n[ \t]*compileSdk[A-Za-z]*\s*=?[^\n]*', '', s)
          s = s.replace('android {', 'android {' + ('\n    compileSdk = 36' if is_kts else '\n    compileSdk 36'), 1)
          if "coreLibraryDesugaring" not in s:
              if is_kts:
                  s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                  s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          open(p, "w").write(s)
          print("gradle patched")
          PY

      - name: Build release APK (x86_64 for emulator)
        working-directory: app
        run: |
          API_BASE="${{ github.event.inputs.api_base || 'https://api.lifeassisto.com' }}"
          flutter build apk --release \
            --target-platform=android-x64 \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=API_BASE="$API_BASE"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Dump merged AndroidManifest (what runs at startup)
        working-directory: app
        run: |
          MANIFEST=$(find build -path '*/merged_manifest*/AndroidManifest.xml' -o -name 'AndroidManifest.xml' -path '*intermediates*' 2>/dev/null | head -1)
          echo "merged manifest: $MANIFEST"
          if [ -n "$MANIFEST" ]; then
            echo "=== providers / services / receivers / application name ==="
            grep -oE '<(provider|service|receiver|application)[^>]*' "$MANIFEST" | sed 's/android:[a-zA-Z]*=//g' | head -60 || true
          fi

      - name: Run app on emulator + capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: |
            set -x
            # wait for FULL boot, not just device connect
            adb wait-for-device
            for i in $(seq 1 60); do
              [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
              sleep 2
            done
            adb shell getprop sys.boot_completed
            APK=$(ls build/app/outputs/flutter-apk/*.apk 2>/dev/null | head -1)
            echo "APK=$APK"; ls -la build/app/outputs/flutter-apk/ || true
            adb install -r -g "$APK"
            PKG=$(adb shell pm list packages 2>/dev/null | tr -d '\r' | grep -i assisto | sed 's/package://' | head -1)
            echo "PACKAGE=$PKG"
            adb logcat -c || true
            adb shell am start -n "$PKG/.MainActivity" || adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
            sleep 25
            adb logcat -d > logcat-full.txt 2>&1
            adb logcat -b crash -d >> logcat-full.txt 2>&1 || true
            echo "================= CRASH / ERROR LINES ================="
            grep -aE "FATAL EXCEPTION|AndroidRuntime|Process.*died|E flutter|E/flutter|Caused by:|beginning of crash|Shutting down VM|UnsatisfiedLinkError|ClassNotFoundException|NoClassDefFound|java.lang.RuntimeException|WorkManager|androidx.startup|androidx.work" logcat-full.txt | head -120 || echo "(no crash-pattern lines found)"
            echo "================= APP ALIVE? ================="
            if adb shell pidof "$PKG" >/dev/null 2>&1; then
              echo "RESULT_APP_RUNNING_YES"
            else
              echo "RESULT_APP_RUNNING_NO"
            fi

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: app/logcat-full.txt
          retention-days: 7
