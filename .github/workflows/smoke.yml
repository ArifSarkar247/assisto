name: Smoke test (emulator API 33)

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend base URL baked into the app"
        required: false
        default: "https://assisto.asalify.com"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---- identical build setup to android.yml (minus signing), x86_64 so it
      #      runs on the emulator ----
      - name: Generate Android platform files
        working-directory: app
        run: flutter create --project-name assisto --org com.assisto --platforms=android .

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Generate launcher icons (adaptive)
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        working-directory: app
        run: dart run flutter_native_splash:create

      - name: Patch manifest (app name + permissions)
        working-directory: app
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace('android:label="assisto"', 'android:label="Assisto"')
          perms = (
              '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              '\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
              '\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              '\n    <uses-permission android:name="android.permission.CAMERA"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
          )
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, s, count=1)
          queries = (
              '\n    <queries>'
              '\n      <intent><action android:name="android.intent.action.DIAL"/>'
              '<data android:scheme="tel"/></intent>'
              '\n      <intent><action android:name="android.intent.action.SENDTO"/>'
              '<data android:scheme="smsto"/></intent>'
              '\n      <intent><action android:name="android.intent.action.VIEW"/></intent>'
              '\n    </queries>\n'
          )
          if '<queries>' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1' + queries, s, count=1)
          open(p, "w").write(s)
          print("manifest patched")
          PY

      - name: Enable core library desugaring + SDK levels
        working-directory: app
        run: |
          python3 - <<'PY'
          import os, re as _re
          kts = "android/app/build.gradle.kts"; gr = "android/app/build.gradle"
          p, is_kts = (kts, True) if os.path.exists(kts) else (gr, False)
          s = open(p).read()
          s = _re.sub(r'\n[ \t]*minSdk[A-Za-z]*\s*=?[^\n]*', '', s)
          s = s.replace('defaultConfig {', 'defaultConfig {' + ('\n        minSdk = 23' if is_kts else '\n        minSdkVersion 23'), 1)
          s = _re.sub(r'\n[ \t]*compileSdk[A-Za-z]*\s*=?[^\n]*', '', s)
          s = s.replace('android {', 'android {' + ('\n    compileSdk = 36' if is_kts else '\n    compileSdk 36'), 1)
          if "coreLibraryDesugaring" not in s:
              if is_kts:
                  s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                  s += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          open(p, "w").write(s)
          print("gradle patched")
          PY

      - name: Build release APK (x86_64 for emulator)
        working-directory: app
        run: |
          API_BASE="${{ github.event.inputs.api_base || 'https://assisto.asalify.com' }}"
          flutter build apk --release \
            --target-platform=android-x64 \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=API_BASE="$API_BASE"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator + capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          working-directory: app
          script: |
            set -x
            adb wait-for-device
            APK=build/app/outputs/flutter-apk/app-release.apk
            adb install -r "$APK"
            PKG=$(adb shell pm list packages | tr -d '\r' | grep -i assisto | sed 's/package://' | head -1)
            echo "PACKAGE=$PKG"
            adb logcat -c
            adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 || true
            sleep 30
            adb logcat -d > logcat-full.txt
            echo "================= CRASH / ERROR LINES ================="
            grep -nE "FATAL EXCEPTION|AndroidRuntime|Process.*assisto.*died|E/flutter|Caused by:|beginning of crash|Shutting down VM|UnsatisfiedLinkError|ClassNotFoundException|NoClassDefFound|RuntimeException" logcat-full.txt | head -120 || echo "(no crash-pattern lines found)"
            echo "================= APP ALIVE? ================="
            if adb shell pidof "$PKG" >/dev/null 2>&1; then
              echo "RESULT: APP RUNNING ✅"
            else
              echo "RESULT: APP NOT RUNNING ❌ (crashed or never started)"
            fi

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: app/logcat-full.txt
          retention-days: 7
