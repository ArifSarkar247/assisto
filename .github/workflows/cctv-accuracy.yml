name: CCTV AI accuracy (person + motion, labeled COCO subset)

# cctvtoday: precision / recall of the Shop Box / phone person model and the
# motion detector on a labeled public test set (see tools/e2e/cctv_accuracy.py
# for the licences and the labeling rule). Nothing downloaded is committed.
on:
  push:
    paths:
      - "tools/e2e/cctv_accuracy.py"
      - ".github/workflows/cctv-accuracy.yml"
      - "edge/shopbox/shopbox/motion.py"
      - "edge/shopbox/shopbox/motion_gate.py"
      - "edge/shopbox/shopbox/night.py"
      - "edge/shopbox/shopbox/analyzer.py"
      - "edge/shopbox/shopbox/cctv_thresholds.json"
  workflow_dispatch:
    inputs:
      night_cam_hours:
        description: "Simulated night camera-hours for the false-alert estimate"
        default: "252"
      mode:
        description: "stills (COCO person + motion), sheets (cctv-accuracy: labelling contact sheets of the licensed clips) or clips (cctv-accuracy: real-clip alert accuracy before/after)"
        default: "stills"
      use_owner_clips:
        description: "Also score the owner's private clips (secret CCTV_OWNER_CLIPS_URL)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  accuracy:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'stills' || inputs.mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Shop Box runtime deps
        working-directory: edge/shopbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Person model (SHA-256 verified)
        working-directory: edge/shopbox
        run: python -m shopbox.model_fetch models/yolox_nano.onnx
      - name: COCO val2017 annotations (CC BY 4.0)
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o /tmp/ann.zip http://images.cocodataset.org/annotations/annotations_trainval2017.zip
          unzip -q -j /tmp/ann.zip annotations/instances_val2017.json -d /tmp/ann
      # cctvacc: OWNER CLIPS (optional, private). The owner's labeled clips
      # live ONLY in a private bucket; the Actions secret CCTV_OWNER_CLIPS_URL
      # holds a time-limited signed link to a zip with labels.csv
      # (file,label[,night]; label = person | no_person) + the images / mp4s.
      # They are downloaded to the runner's temp dir, scored, and deleted;
      # only aggregate numbers reach the artifact. Never commit real clips.
      - name: Owner clips (private, optional)
        id: owner
        if: github.event_name == 'workflow_dispatch' && inputs.use_owner_clips
        env:
          CLIPS_URL: ${{ secrets.CCTV_OWNER_CLIPS_URL }}
        run: |
          if [ -z "$CLIPS_URL" ]; then echo "no owner clips secret set - skipped"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/owner_clips"
          curl -sSfL -o "$RUNNER_TEMP/owner.zip" "$CLIPS_URL"
          unzip -q "$RUNNER_TEMP/owner.zip" -d "$RUNNER_TEMP/owner_clips"
          rm -f "$RUNNER_TEMP/owner.zip"
          test -f "$RUNNER_TEMP/owner_clips/labels.csv"
          echo "dir=$RUNNER_TEMP/owner_clips" >> "$GITHUB_OUTPUT"
      - name: Evaluate
        env:
          NIGHT_HOURS: ${{ inputs.night_cam_hours || '252' }}
          OWNER_DIR: ${{ steps.owner.outputs.dir }}
        run: |
          set -o pipefail
          python tools/e2e/cctv_accuracy.py --ann /tmp/ann/instances_val2017.json \
            --model edge/shopbox/models/yolox_nano.onnx --out cctv_accuracy.json --n 400 \
            --night-cam-hours "$NIGHT_HOURS" --owner-clips "${OWNER_DIR:-}" \
            | tee cctv_accuracy.txt
      - name: Delete owner clips from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/owner_clips" "$RUNNER_TEMP/owner.zip"
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # ghstore: storage quota never fails a green build
        with:
          name: cctv-accuracy
          path: |
            cctv_accuracy.json
            cctv_accuracy.txt
          retention-days: 5

  # cctv-accuracy: REAL video clips (openly licensed, Wikimedia Commons; list,
  # licences and labels in tools/cctvacc/clips.json + SOURCES.md) through the
  # exact Shop Box / Guard Box alert path (motion gate -> person model ->
  # confirm -> cooldown). Downloads are SHA-1 checked; nothing is committed.
  clips:
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'sheets' || inputs.mode == 'clips')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Shop Box runtime deps
        working-directory: edge/shopbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Person model (SHA-256 verified)
        if: inputs.mode == 'clips'
        working-directory: edge/shopbox
        run: python -m shopbox.model_fetch models/yolox_nano.onnx
      - name: Clips (Wikimedia Commons, SHA-1 verified)
        run: python tools/cctvacc/fetch.py --out "$RUNNER_TEMP/clips"
      - name: Contact sheets (for human labels)
        if: inputs.mode == 'sheets'
        run: python tools/cctvacc/sheets.py --clips "$RUNNER_TEMP/clips" --out sheets
      - name: Alert accuracy, before / after
        if: inputs.mode == 'clips'
        run: |
          set -o pipefail
          python tools/cctvacc/run_clips.py --clips "$RUNNER_TEMP/clips" \
            --model edge/shopbox/models/yolox_nano.onnx --out cctv_clips.json | tee cctv_clips.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: cctv-clips-${{ inputs.mode }}
          path: |
            sheets/
            cctv_clips.json
            cctv_clips.txt
          if-no-files-found: ignore
          retention-days: 5
