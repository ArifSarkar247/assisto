name: CCTV zone detections accuracy (gate / loitering / post / gate open / tamper)

# cctvdet (CCTV Guard V3 part C): precision / recall of each stage-1 zone
# detection through the real Shop Box code + YOLOX-Nano on labelled scenarios
# built from licensed COCO val2017 images (see tools/e2e/cctv_detect_accuracy.py
# for the licences, the scenarios and the honest limits). Nothing downloaded
# is committed; the numbers feed cctv_thresholds.json["measured"].
on:
  push:
    paths:
      - "tools/e2e/cctv_detect_accuracy.py"
      - ".github/workflows/cctv-detect-accuracy.yml"
      - "edge/shopbox/shopbox/detect_rules.py"
  workflow_dispatch:
    inputs:
      n:
        description: "Scenarios per kind"
        default: "30"
      minutes:
        description: "mode=train: training time budget (minutes)"
        default: "200"
      groups:
        description: "mode=v3: groups to tune (vehicles,post,loiter,crowd)"
        default: "vehicles,post,loiter,crowd"
      veh_run:
        description: "mode=v3: run id of a mode=train run (its Bangladesh vehicle model)"
        default: ""
      mode:
        description: "scenarios (stage-2 rule P/R), frames (cctvdet3 detector diagnostic) v3 (cctvdet3: tune on calibration, report held-out) or train (cctvdet3: Bangladesh vehicle model)"
        default: "scenarios"

permissions:
  contents: read
  actions: read

concurrency:
  group: cctv-detect-accuracy-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  detections:
    if: ${{ inputs.mode != 'train' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Shop Box runtime deps
        working-directory: edge/shopbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Person model (SHA-256 verified)
        working-directory: edge/shopbox
        run: python -m shopbox.model_fetch models/yolox_nano.onnx
      - name: Vehicle model YOLOX-Tiny (Apache-2.0, SHA-256 verified)
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o edge/shopbox/models/yolox_tiny.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx
          echo "427cc366d34e27ff7a03e2899b5e3671425c262ea2291f88bb942bc1cc70b0f7  edge/shopbox/models/yolox_tiny.onnx" | sha256sum -c -
      - name: COCO val2017 annotations (CC BY 4.0)
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o /tmp/ann.zip http://images.cocodataset.org/annotations/annotations_trainval2017.zip
          unzip -q -j /tmp/ann.zip annotations/instances_val2017.json -d /tmp/ann
      - name: Frame-level diagnostic (cctvdet3)
        if: ${{ inputs.mode == 'frames' }}
        run: |
          set -o pipefail
          python tools/e2e/cctv_vehicle_frames.py --ann /tmp/ann/instances_val2017.json \
            --model nano=edge/shopbox/models/yolox_nano.onnx --model tiny=edge/shopbox/models/yolox_tiny.onnx \
            --out cctv_detect.json --n 220 | tee cctv_detect.txt
      - name: The Bangladesh vehicle model of a mode=train run (artifact, SHA-256 printed)
        if: ${{ inputs.mode == 'v3' && inputs.veh_run != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cctv-vehicle-bd
          path: /tmp/bd
          run-id: ${{ inputs.veh_run }}
          github-token: ${{ github.token }}
      - name: Tune on calibration, report held-out (cctvdet3)
        if: ${{ inputs.mode == 'v3' }}
        timeout-minutes: 120
        env:
          N: ${{ inputs.n || '30' }}
          GROUPS: ${{ inputs.groups || 'vehicles,post,loiter,crowd' }}
        run: |
          set -o pipefail
          BD=""
          # artifacts expire: a ci/ branch may carry the trained model (never main)
          if [ ! -f /tmp/bd/assisto_vehicle_bd_nano.onnx ] && [ -f .ci_models/assisto_vehicle_bd_nano.onnx ]; then
            mkdir -p /tmp/bd && cp .ci_models/assisto_vehicle_bd_nano.onnx /tmp/bd/
            echo "2792908189f104ecb2316ddc09b49c01067dc06e77f443ab52c0f3ff3f0981a7  /tmp/bd/assisto_vehicle_bd_nano.onnx" | sha256sum -c -
            cp /tmp/bd/assisto_vehicle_bd_nano.onnx /tmp/bd/x && sha256sum /tmp/bd/x | sed 's#/tmp/bd/x#assisto_vehicle_bd_nano.onnx#' > /tmp/bd/assisto_vehicle_bd_nano.onnx.sha256
          fi
          if [ -f /tmp/bd/assisto_vehicle_bd_nano.onnx ]; then
            sha256sum /tmp/bd/assisto_vehicle_bd_nano.onnx; cat /tmp/bd/assisto_vehicle_bd_nano.onnx.sha256
            BD="--bd /tmp/bd/assisto_vehicle_bd_nano.onnx"
          fi
          python tools/e2e/cctv_detect_v3.py --ann /tmp/ann/instances_val2017.json \
            --nano edge/shopbox/models/yolox_nano.onnx --tiny edge/shopbox/models/yolox_tiny.onnx $BD \
            --groups "$GROUPS" --out cctv_detect.json --n "$N" | tee cctv_detect.txt
      - name: Evaluate
        if: ${{ inputs.mode != 'frames' && inputs.mode != 'v3' }}
        env:
          N: ${{ inputs.n || '30' }}
        run: |
          set -o pipefail
          python tools/e2e/cctv_detect_accuracy.py --ann /tmp/ann/instances_val2017.json \
            --model edge/shopbox/models/yolox_nano.onnx --out cctv_detect.json --n "$N" \
            | tee cctv_detect.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # ghstore: storage quota never fails a green build
        if: always()
        with:
          name: cctv-detect-accuracy
          path: |
            cctv_detect.json
            cctv_detect.txt
          retention-days: 5

  vehicle_train:
    # cctvdet3 (mode=train): fine-tune YOLOX-Nano (Apache-2.0) on the Sylhet
    # train/ folders (CC BY 4.0) + vehicle-free COCO train2017 pictures -> a
    # vehicle model that knows CNG, rickshaw, leguna ...; PUBLISHED as a
    # release asset (releases never expire) from ci/cctvdet3-arb only, never
    # overwriting an asset with a different hash; then measured.
    if: ${{ inputs.mode == 'train' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch, YOLOX 0.3.0 code, Shop Box runtime)
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy==1.26.4" loguru thop psutil tabulate tqdm "onnx==1.16.1" requests
          pip install -r edge/shopbox/requirements.txt
          git clone -q --depth 1 --branch 0.3.0 https://github.com/Megvii-BaseDetection/YOLOX.git /tmp/YOLOX
          echo "PYTHONPATH=/tmp/YOLOX" >> "$GITHUB_ENV"
      - name: Weights and models (SHA-256 verified)
        timeout-minutes: 10
        run: |
          mkdir -p /tmp/w edge/shopbox/models
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o /tmp/w/yolox_nano.pth \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.pth
          echo "cd28f55fbbc1829f99d9ac9b38a16d259a22889739c8728ea877610201feff7b  /tmp/w/yolox_nano.pth" | sha256sum -c -
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o edge/shopbox/models/yolox_tiny.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx
          echo "427cc366d34e27ff7a03e2899b5e3671425c262ea2291f88bb942bc1cc70b0f7  edge/shopbox/models/yolox_tiny.onnx" | sha256sum -c -
          cd edge/shopbox && python -m shopbox.model_fetch models/yolox_nano.onnx
      - name: COCO annotations (CC BY 4.0) - train2017 for negatives, val2017 for the eval
        timeout-minutes: 15
        run: |
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o /tmp/ann.zip http://images.cocodataset.org/annotations/annotations_trainval2017.zip
          unzip -q -j /tmp/ann.zip annotations/instances_val2017.json annotations/instances_train2017.json -d /tmp/ann
      - name: Smoke (30 iterations on 64 photos, fails fast)
        timeout-minutes: 30
        run: |
          python tools/e2e/cctv_vehicle_train.py --weights /tmp/w/yolox_nano.pth --smoke \
            --neg-ann /tmp/ann/instances_train2017.json --out /tmp/smoke.onnx --minutes 2 2>&1 | tail -20
          python -c "import onnxruntime as o; s=o.InferenceSession('/tmp/smoke.onnx'); import numpy as n; print(s.run(None,{'images':n.zeros((1,3,416,416),n.float32)})[0].shape)"
      - name: Train
        timeout-minutes: 230
        env:
          MIN: ${{ inputs.minutes || '200' }}
        run: |
          set -o pipefail
          python tools/e2e/cctv_vehicle_train.py --weights /tmp/w/yolox_nano.pth \
            --neg-ann /tmp/ann/instances_train2017.json --neg 1500 \
            --out assisto_vehicle_bd_nano.onnx --minutes "$MIN" 2>&1 | grep -v "CPU Mode\|^ *$" | tee train.txt
      - name: Publish the model as a release asset (ci/cctvdet3-arb only, never overwritten)
        id: publish
        if: ${{ github.ref == 'refs/heads/ci/cctvdet3-arb' }}
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=shopbox-vehicle-bd-1
          A=assisto_vehicle_bd_nano.onnx
          NEW=$(sha256sum "$A" | cut -d' ' -f1)
          echo "sha=$NEW" >> "$GITHUB_OUTPUT"
          sed -e "s/@SHA256@/$NEW/" -e "s/@RUN@/$GITHUB_RUN_ID/" -e "s/@COMMIT@/$GITHUB_SHA/" \
            tools/e2e/cctv_vehicle_model_card.md > assisto_vehicle_bd_nano.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$A"; then
              gh release download "$TAG" -p "$A" -D /tmp/old
              OLD=$(sha256sum "/tmp/old/$A" | cut -d' ' -f1)
              if [ "$OLD" != "$NEW" ]; then
                echo "::error::$TAG already has $A with sha256 $OLD - not overwriting with $NEW"
                echo "sha=$OLD" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              echo "same model already published ($OLD)"
            else
              gh release upload "$TAG" "$A" assisto_vehicle_bd_nano.md
            fi
          else
            gh release create "$TAG" "$A" assisto_vehicle_bd_nano.md --target "$GITHUB_SHA" --prerelease \
              --title "Shop Box vehicle model (Bangladesh) 1" --notes-file assisto_vehicle_bd_nano.md
          fi
          echo "PUBLISHED $TAG/$A sha256 $NEW"
      - name: Frame-level accuracy (stock nano / tiny vs the Bangladesh model)
        timeout-minutes: 45
        run: |
          set -o pipefail
          python tools/e2e/cctv_vehicle_frames.py --ann /tmp/ann/instances_val2017.json \
            --model nano=edge/shopbox/models/yolox_nano.onnx --model tiny=edge/shopbox/models/yolox_tiny.onnx \
            --model bd=assisto_vehicle_bd_nano.onnx --out cctv_frames.json --n 260 | tee cctv_frames.txt

  vehicle_heldout:
    # cctvdet3: the shipped vehicle settings with the model just published,
    # BEFORE (stage-2 settings) vs AFTER on the HELD-OUT scenarios only (no
    # grid: the settings were picked on calibration in CI 43967156868)
    needs: vehicle_train
    if: ${{ inputs.mode == 'train' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shop Box runtime + models (SHA-256 verified)
        timeout-minutes: 10
        env:
          SHA: ${{ needs.vehicle_train.outputs.sha }}
        run: |
          python -m pip install --upgrade pip
          pip install -r edge/shopbox/requirements.txt
          cd edge/shopbox && python -m shopbox.model_fetch models/yolox_nano.onnx && cd ../..
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o edge/shopbox/models/yolox_tiny.onnx \
            https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.onnx
          mkdir -p /tmp/bd
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o /tmp/bd/assisto_vehicle_bd_nano.onnx \
            "https://github.com/${{ github.repository }}/releases/download/shopbox-vehicle-bd-1/assisto_vehicle_bd_nano.onnx"
          echo "$SHA  /tmp/bd/assisto_vehicle_bd_nano.onnx" | sha256sum -c -
          curl -sSfL --retry 6 --retry-all-errors --retry-delay 30 -o /tmp/ann.zip http://images.cocodataset.org/annotations/annotations_trainval2017.zip
          unzip -q -j /tmp/ann.zip annotations/instances_val2017.json -d /tmp/ann
      - name: Held-out, before vs after (vehicles)
        timeout-minutes: 45
        run: |
          set -o pipefail
          python tools/e2e/cctv_detect_v3.py --ann /tmp/ann/instances_val2017.json \
            --nano edge/shopbox/models/yolox_nano.onnx --tiny edge/shopbox/models/yolox_tiny.onnx \
            --bd /tmp/bd/assisto_vehicle_bd_nano.onnx --groups vehicles --fixed --n 30 | tee cctv_detect.txt
