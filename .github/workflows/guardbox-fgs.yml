name: Phone camera + camera FGS E2E (old phone = CCTV, emulated camera)

# guardbox-play (owner standing order 18 Nov: nothing hidden from Play).
# "Old phone = CCTV camera" END TO END with the camera FOREGROUND SERVICE
# that now ships in the Play build too: the REAL app on an API-33 emulator
# with an EMULATED back camera (-camera-back emulated, as the release gate's
# circle leg) against the throw-away Django (settings_e2eproof +
# seed_camflows). app/integration_test/flows/phonecam_fgs_flow.dart: pair ->
# Start -> service + notification -> motion alert with photo to the second
# account -> live view (real WebRTC video) -> SCREEN OFF keeps watching (2nd
# alert) -> Stop in the notification -> service gone (dumpsys) -> on-screen
# Stop. tools/e2e/pcfgs_sidecar.sh does the shell parts. No secrets, never
# the live server. "[skip pcfgs]" in a commit message runs checks only.

on:
  push:
    branches: ["ci/cctv-guardbox-arb", "ci/guardbox-fgs"]
  workflow_dispatch:

concurrency:
  group: guardbox-fgs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    if: ${{ !contains(github.event.head_commit.message, '[skip pcfgs]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assisto_ci
          POSTGRES_PASSWORD: ci-reality-throwaway   # disposable container, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      ASSISTO_CI_PG_NAME: assisto_ci
      ASSISTO_CI_PG_PASSWORD: ci-reality-throwaway
      REALITY_OUT: ${{ github.workspace }}/reality_out
      E2E_OUTBOX: ${{ github.workspace }}/reality_out/outbox.jsonl
      E2E_VENDOR_SIM: "1"
      E2E_EXTRA_SEED: seed_camflows
      E2E_HLS_DIR: ${{ github.workspace }}/reality_out/hls
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the emulator image needs ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY/PyPy" || true
          df -h / | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend deps
        run: python -m pip install -q -r backend/requirements.txt pyyaml
      - name: Throw-away backend with CI fakes + fake vendor clouds (seed_camflows self-check, serve :8700)
        run: bash tools/e2e/backend_up.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'  # tools/ci/flutter_version.txt
          channel: stable
          cache: true
      - name: Add integration_test + flutter_driver (CI-only dev deps) + real build number
        working-directory: app
        run: |
          python3 - <<'PY'
          import os, re
          p = "pubspec.yaml"
          s = open(p).read()
          if "integration_test:" not in s:
              s = s.replace("dev_dependencies:\n  flutter_test:\n    sdk: flutter\n",
                            "dev_dependencies:\n  flutter_test:\n    sdk: flutter\n"
                            "  integration_test:\n    sdk: flutter\n"
                            "  flutter_driver:\n    sdk: flutter\n", 1)
              assert "integration_test:" in s, "dev_dependencies block not found"
          n = 9000 + int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          s, k = re.subn(r"(?m)^version: .*$", "version: 1.0.%d+%d" % (n, n), s, count=1)
          assert k == 1
          open(p, "w").write(s)
          PY
      - name: Replay android.yml build prep
        run: python3 tools/reality/replay_android_steps.py
      - name: Debug-only cleartext to the in-runner backend (Skia in the test APK)
        working-directory: app
        run: |
          python3 - <<'PY'
          p = "android/app/src/debug/AndroidManifest.xml"
          s = open(p).read()
          if "usesCleartextTraffic" not in s:
              meta = ('        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" '
                      'android:value="false"/>\n')
              s = s.replace("</manifest>",
                  '    <application android:usesCleartextTraffic="true">\n' + meta +
                  '    </application>\n</manifest>', 1)
              open(p, "w").write(s)
          PY
      - name: Analyze the flows (fail on errors)
        working-directory: app
        run: |
          set +e
          flutter analyze integration_test test_driver > ia.txt 2>&1; cat ia.txt | tail -40
          grep -qE "error •" ia.txt && { echo "::error::integration flows do not compile"; exit 1; }
          exit 0
      - name: Build the x86_64 debug test APK once
        working-directory: app
        run: |
          python3 "$GITHUB_WORKSPACE/tools/ci/raise_plugin_compile_sdk.py" 36
          timeout 1800 flutter build apk --debug --target-platform=android-x64 \
            --target=integration_test/reality_all_test.dart \
            --dart-define=REALITY_API_BASE=http://10.0.2.2:8700 \
            --dart-define=REALITY_ONLY=start,pcfgs
          echo "REALITY_APK=$PWD/build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_ENV"
      - name: Free the runner for the emulator
        working-directory: app
        run: |
          (cd android && timeout 60 ./gradlew --stop) || true
          pkill -f 'KotlinCompileDaemon' || true
          pkill -f 'GradleDaemon' || true
          # keep only the test APK; Gradle caches are not needed while the emulator runs
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/e2e-app-debug.apk"
          echo "REALITY_APK=$RUNNER_TEMP/e2e-app-debug.apk" >> "$GITHUB_ENV"
          rm -rf build/app/intermediates ~/.gradle/caches/transforms-* ~/.gradle/caches/build-cache-* || true
          free -m; df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the phone-camera FGS flow on API 33 (emulated back camera)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REALITY_ONLY: start+pcfgs
          REALITY_TOTAL_SECONDS: "2700"
          REALITY_DRIVE_SECONDS: "2400"
          REALITY_EMU_OPTS: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 480
          ram-size: 4096M
          heap-size: 576M
          cores: 3
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          pre-emulator-launch-script: for c in "$HOME"/.android/avd/*.avd/config.ini; do [ -f "$c" ] && sed -i '/^hw.keyboard=/d' "$c" && echo 'hw.keyboard=yes' >> "$c"; done; true
          script: bash tools/e2e/pcfgs_run.sh
      - name: Stop Django
        if: always()
        run: kill "$(cat "$REALITY_OUT/django.pid" 2>/dev/null)" 2>/dev/null || true
      - name: Proof (pcfgs_proof.json; red unless the flow passed and dumpsys agrees)
        if: always()
        run: |
          python3 tools/reality/summarize.py "$REALITY_OUT" > /dev/null || true
          python3 tools/e2e/pcfgs_proof.py "$REALITY_OUT"
      - name: Upload evidence
        continue-on-error: true  # ghstore: storage quota never fails a green build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardbox-fgs-emulator
          path: |
            reality_out/
            !reality_out/.recording
            !reality_out/.attempt.log
          retention-days: 2
          if-no-files-found: warn
