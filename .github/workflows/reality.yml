name: Reality audit (real user flows on an emulator)

# OWNER ORDER (reality audit): a feature is DONE only when a real user flow
# works end-to-end. This job boots a THROW-AWAY Django inside the runner
# (settings_ci: file sqlite, DEBUG off, every paid/external key scrubbed),
# seeds demo users (seed_reality), boots the API-33 emulator and drives the
# app through every flow in app/integration_test/ against
# http://10.0.2.2:8700. It NEVER touches api.lifeassisto.com or the live DB.
#
# Evidence (artifact "reality-evidence"): per-step PNG screenshots, screen
# recordings, results.json (per flow: steps, every HTTP call + status), the
# Django request log, logcat, and reality_summary.md (A/B/C table, also on the
# run page). The job only fails on infrastructure errors; flow verdicts live
# in the summary so one broken feature never hides the others' evidence.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma list of flow groups (start,home,personal,family,circle,business,docs,sweep); empty = all"
        required: false
        default: ""
      emu_gpu:
        description: "Emulator -gpu mode(s), comma list = one job per group per mode (swiftshader_indirect, swangle_indirect, guest)"
        required: false
        default: "swiftshader_indirect"
  schedule:
    - cron: "30 20 * * *"   # nightly, 02:30 Asia/Dhaka

concurrency:
  group: reality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # rt2: one job PER flow group (matrix). The hosted emulator dies a few
  # minutes after a (re)boot; on one shared runner that death cascaded into
  # every later group (runs 39878171841 / 39884806316: 7 flows never got a
  # verdict). Each group now gets its own runner, backend and fresh emulator,
  # and runs "start+<group>" (log in, then the group) in ONE app process.
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.p.outputs.groups }}
      gpus: ${{ steps.p.outputs.gpus }}
    steps:
      - id: p
        env:
          ONLY: ${{ github.event.inputs.only }}
          GPUS: ${{ github.event.inputs.emu_gpu }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          allg = ["start", "home", "personal", "family", "circle", "business", "docs", "sweep"]
          want = [g.strip() for g in (os.environ.get("ONLY") or "").split(",") if g.strip()]
          sel = [g for g in allg if not want or g in want] or allg
          print("groups=" + json.dumps(sel))
          gpus = [g.strip() for g in (os.environ.get("GPUS") or "").split(",") if g.strip()]
          print("gpus=" + json.dumps(gpus or ["swiftshader_indirect"]))
          PY

  reality:
    needs: plan
    runs-on: ubuntu-latest
    # A hung adb call once held a run for 6h; one group needs ~20-30 min.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
        gpu: ${{ fromJson(needs.plan.outputs.gpus) }}
    name: reality (${{ matrix.group }}, ${{ matrix.gpu }})
    # rt1: a throw-away Postgres (production's engine) instead of the sqlite
    # file — run 39859999833 hit "database is locked" (POST /circle/1/call
    # 500, a call.incoming silently never queued) under the threaded server.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: assisto_ci
          POSTGRES_PASSWORD: ci-reality-throwaway   # disposable container, not a secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      ASSISTO_CI_DB: ${{ github.workspace }}/backend/ci_reality.sqlite3
      ASSISTO_CI_PG_NAME: assisto_ci
      ASSISTO_CI_PG_PASSWORD: ci-reality-throwaway
      REALITY_OUT: ${{ github.workspace }}/reality_out
      # "start+personal" = one drive: Start flows log in, then the group.
      REALITY_DRIVE: ${{ matrix.group == 'start' && 'start' || format('start+{0}', matrix.group) }}
      REALITY_GPU: ${{ matrix.gpu }}
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------ backend (in-runner)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend deps
        run: python -m pip install -q -r backend/requirements.txt pyyaml
      - name: API contract (report only here; android.yml gates on it)
        env:
          DJANGO_SETTINGS_MODULE: assisto_backend.settings_test
        run: |
          mkdir -p "$REALITY_OUT"
          timeout 600 python tools/route_check.py --report-only --md "$REALITY_OUT/route_check.md" | tail -80
      - name: Migrate + seed (settings_ci, sqlite file)
        working-directory: backend
        run: |
          timeout 600 python manage.py migrate --settings=assisto_backend.settings_ci -v 0
          timeout 300 python manage.py seed_reality --settings=assisto_backend.settings_ci --out "$REALITY_OUT/seed.json"
          python - <<'PY'
          import json, os
          d = json.load(open(os.environ["REALITY_OUT"] + "/seed.json"))
          assert not d["failed_steps"], d["failed_steps"]
          assert d["circle"]["a_state"] == "accepted", d["circle"]
          print("seed OK:", len(d["steps"]), "steps")
          PY
      - name: Start Django on :8700 (reachable from the emulator as 10.0.2.2:8700)
        working-directory: backend
        run: |
          nohup python manage.py runserver 0.0.0.0:8700 --noreload --settings=assisto_backend.settings_ci \
            > "$REALITY_OUT/django.log" 2>&1 &
          echo $! > "$REALITY_OUT/django.pid"
          for i in $(seq 1 60); do
            curl -fsS -m 5 http://127.0.0.1:8700/api/v1/health >/dev/null && { echo "django up"; exit 0; }
            sleep 2
          done
          echo "::error::Django did not come up"; tail -50 "$REALITY_OUT/django.log"; exit 1

      # ------------------------------------------------ app (same build prep as android.yml)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add integration_test + flutter_driver (CI-only dev deps)
        working-directory: app
        run: |
          python3 - <<'PY'
          p = "pubspec.yaml"
          s = open(p).read()
          if "integration_test:" not in s:
              s = s.replace("dev_dependencies:\n  flutter_test:\n    sdk: flutter\n",
                            "dev_dependencies:\n  flutter_test:\n    sdk: flutter\n"
                            "  integration_test:\n    sdk: flutter\n"
                            "  flutter_driver:\n    sdk: flutter\n", 1)
              assert "integration_test:" in s, "dev_dependencies block not found"
              open(p, "w").write(s)
          # rt1: a REAL build number. pubspec says 1.0.0+1, so the test APK
          # was "build 1" and My Circle's minimum-version gate (183) blocked
          # every circle flow with "Update Assisto to use My Circle".
          import os, re
          n = 9000 + int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          s = open(p).read()
          s, k = re.subn(r"(?m)^version: .*$", "version: 1.0.%d+%d" % (n, n), s, count=1)
          assert k == 1, "pubspec version line not found"
          open(p, "w").write(s)
          print("dev deps ready; version 1.0.%d+%d" % (n, n))
          PY
      - name: Replay android.yml build prep (create, overlay, pub get, icons, splash, manifest, gradle)
        run: python3 tools/reality/replay_android_steps.py
      - name: Debug-only cleartext to the in-runner backend
        working-directory: app
        run: |
          # src/debug/ only: the release manifest is untouched.
          python3 - <<'PY'
          p = "android/app/src/debug/AndroidManifest.xml"
          s = open(p).read()
          if "usesCleartextTraffic" not in s:
              s = s.replace("</manifest>",
                  '    <application android:usesCleartextTraffic="true"/>\n</manifest>', 1)
              open(p, "w").write(s)
          print(open(p).read())
          PY
      - name: Analyze the flows (fail on errors)
        working-directory: app
        run: |
          set +e
          flutter analyze integration_test test_driver > ia.txt 2>&1; cat ia.txt
          grep -qE "error •" ia.txt && { echo "::error::integration flows do not compile"; exit 1; }
          exit 0
      - name: Build the x86_64 debug test APK ONCE (before the emulator; drive installs it)
        working-directory: app
        run: |
          # rt2: REALITY_ONLY is a compile-time define, so this job's groups
          # are baked in; run_flows.sh then uses --use-application-binary and
          # no Gradle runs while the emulator is up.
          timeout 1800 flutter build apk --debug --target-platform=android-x64 \
            --target=integration_test/reality_all_test.dart \
            --dart-define=REALITY_API_BASE=http://10.0.2.2:8700 \
            --dart-define=REALITY_ONLY="${REALITY_DRIVE//+/,}"
          ls -la build/app/outputs/flutter-apk/
          echo "REALITY_APK=$PWD/build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_ENV"

      # ------------------------------------------------ emulator + flows
      - name: Free the runner for the emulator (stop Gradle/Kotlin daemons)
        working-directory: app
        run: |
          # The pre-build leaves Gradle + Kotlin daemons resident (GBs of RAM); with
          # Django and the 2-core emulator on the same runner, the emulator stalled
          # and adb wedged seconds into flow 01 (21-22 Oct runs).
          (cd android && timeout 60 ./gradlew --stop) || true
          pkill -f 'KotlinCompileDaemon' || true
          pkill -f 'GradleDaemon' || true
          free -m
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run reality flows on API 33
        uses: reactivecircus/android-emulator-runner@v2
        env:
          REALITY_ONLY: ${{ env.REALITY_DRIVE }}
          REALITY_TOTAL_SECONDS: "1800"
          REALITY_EMU_OPTS: -no-snapshot -no-window -gpu ${{ env.REALITY_GPU }} -noaudio -no-boot-anim -camera-back none -camera-front none
        with:
          api-level: 33
          arch: x86_64
          target: default   # AOSP, no Google Play services. 22 Oct: the google_apis image
          # froze the whole emulator (adb wedged) during Play-services activity on
          # EVERY run, build 150's previously-passing code included.
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 480
          # rt2: more guest RAM / heap and cores (the 4-vCPU 16 GB runner now
          # runs no Gradle next to the emulator), no camera HALs.
          ram-size: 4096M
          heap-size: 576M
          cores: 3
          emulator-options: -no-snapshot -no-window -gpu ${{ env.REALITY_GPU }} -noaudio -no-boot-anim -camera-back none -camera-front none
          # /bin/sh one-liner: all logic (and every adb timeout) is in the script
          script: bash tools/reality/run_flows.sh

      # ------------------------------------------------ evidence (per group)
      - name: Summarize this group
        if: always()
        env:
          REALITY_ONLY: ${{ env.REALITY_DRIVE }}
          GITHUB_STEP_SUMMARY: ""
        run: |
          cp -r /tmp/android-runner "$REALITY_OUT/emu_crash" 2>/dev/null || true
          python3 tools/reality/summarize.py "$REALITY_OUT" | head -60
      - name: Stop Django
        if: always()
        run: kill "$(cat "$REALITY_OUT/django.pid" 2>/dev/null)" 2>/dev/null || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reality-evidence-${{ matrix.group }}--${{ matrix.gpu }}
          path: |
            reality_out/
            !reality_out/.recording
            !reality_out/.attempt.log
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------ verdict (all groups)
  verdict:
    needs: [plan, reality]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reality-evidence-*
          path: groups
      - name: Merge per-group results (one A/B/C/D table per gpu mode)
        env:
          GPUS: ${{ needs.plan.outputs.gpus }}
        run: |
          # reality-evidence-<group>--<gpu>  ->  by_gpu/<gpu>/<group>
          for d in groups/reality-evidence-*; do
            [ -d "$d" ] || continue
            n="${d#groups/reality-evidence-}"; g="${n%%--*}"; m="${n#*--}"
            mkdir -p "by_gpu/$m"; mv "$d" "by_gpu/$m/$g"
          done
          ls by_gpu/*
          for m in by_gpu/*; do
            echo "### gpu: ${m#by_gpu/}" >> "$GITHUB_STEP_SUMMARY"
            python3 tools/reality/merge_groups.py "$m"
          done
          # the Verdict judges the FIRST mode in the list (the default one)
          first=$(python3 -c "import json,os;print(json.loads(os.environ['GPUS'])[0])")
          mkdir -p groups && cp "by_gpu/$first/reality_summary.json" "by_gpu/$first/reality_summary.md" groups/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reality-summary
          path: |
            by_gpu/*/reality_summary.json
            by_gpu/*/reality_summary.md
      # A green run must MEAN the flows passed: the first run (21 Oct) showed
      # green with ZERO flows executed (driver crashed, no results.json).
      - name: Verdict (fail on no results or any C/D)
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open("groups/reality_summary.json"))
          except Exception as e:
              print("::error::no reality summary (%s)" % e); sys.exit(1)
          rows = d.get("rows") or []
          bad = [r for r in rows if str(r.get("class", "")).startswith(("C", "D"))]
          print("flows:", len(rows), "counts:", d.get("counts"))
          if not [r for r in rows if r.get("class") != "D"]:
              print("::error::no flow produced a result (app never wrote results.json)"); sys.exit(1)
          for r in bad:
              print("::error::%s: %s [%s] %s %s" % (r.get("class"), r.get("id"), r.get("job"), r.get("feature"), r.get("detail") or r.get("failed_step") or ""))
          sys.exit(1 if bad else 0)
          PY
