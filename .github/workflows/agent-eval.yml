# Agent Core TESTING CENTER (owner final order 27 Oct, PART 2): the agent's
# unit tests + every topic's >=200-goal eval set, graded deterministically,
# on every ci/** push. CI mode = scripted brain at the AI router's provider
# seam (no key, no spend); the per-case report is uploaded as an artifact.
# Live-model evals run on the server only, with the owner's approval
# (manage.py agent_eval --live), never here.
name: agent-eval

on:
  push:
    branches: ['ci/**']
    # cost control (owner 28 Oct): the agent evals only test backend code
    paths: ['backend/**', '.github/workflows/agent-eval.yml']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to check'
        required: true

concurrency:
  group: agent-eval-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -q -r backend/requirements.txt tblib==3.0.0
      - name: agent core unit tests + eval sets
        working-directory: backend
        env:
          AGENT_EVAL_REPORT: ${{ runner.temp }}/agent_eval_money.json
        run: |
          export INTEGRATIONS_FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          python manage.py test core.tests_agentcore core.tests_agentcore_eval core.tests_agentcore_tools core.tests_agentcore_topics core.tests_aftrust core.tests_afcrisis core.tests_afinject core.tests_afobs core.tests_afmulti core.tests_affeedback core.tests_afeval_live core.tests_afmultiturn web.tests_agentcore_owner --parallel 2 --settings=assisto_backend.settings_test --noinput -v 2
      - name: agent core integration points (flags, routes, pricing, owner admin)
        working-directory: backend
        run: |
          export INTEGRATIONS_FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          python manage.py test core.tests_feature_flags core.tests_route_coverage core.tests_profit_guard core.tests_pricing_limits core.tests_api_contract core.tests_ai_router web.tests_o2_owner_admin web.tests_ff1_features web.tests_ai_router_owner --settings=assisto_backend.settings_test --noinput
      - name: eval thresholds (per topic, CI mode)
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}
          # topic=min pass rate; the tests assert the same bars (goalsets.THRESHOLDS)
          AGENT_EVAL_THRESHOLDS: money=1.0,family=1.0,safety=1.0,documents=1.0,travel=1.0,health=1.0,learning=1.0,business=1.0,crisis=1.0,inject=1.0,inject_fence=1.0,multi=1.0,multiturn=1.0
        run: |
          python - <<'PY'
          import glob, json, os, sys
          th = dict(kv.split("=") for kv in os.environ["AGENT_EVAL_THRESHOLDS"].split(","))
          seen, bad = {}, []
          for p in glob.glob(os.path.join(os.environ["REPORT_DIR"], "agent_eval_*.json")):
              r = json.load(open(p))
              seen[r["topic"]] = (r["passed"], r["cases"])
          lines = ["| topic | passed | cases | rate | bar |", "|---|---|---|---|---|"]
          for t, bar in th.items():
              p, n = seen.get(t, (0, 0))
              rate = p / n if n else 0.0
              lines.append("| %s | %d | %d | %.1f%% | %d%% |" % (t, p, n, 100 * rate, 100 * float(bar)))
              if n < 200 or rate < float(bar):
                  bad.append(t)
          out = "\n".join(lines)
          print(out)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(out + "\n")
          sys.exit("below threshold: %s" % bad if bad else 0)
          PY
      - name: upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-report
          path: ${{ runner.temp }}/agent_eval_*.json
          if-no-files-found: ignore
