# Full test suites on GitHub-hosted runners (owner order 27 Oct night,
# MAXIMUM MODE). The 2-vCPU server queued every agent's full `flutter test`
# (~70 min each) behind one lock; here the same suites run sharded in
# parallel in ~15 min, free (public repo). Local runs stay for targeted tests.
#
# Trigger: push any branch named ci/<name>, or run manually with a ref.
# No secrets are used; never runs on the self-hosted runner (public repo).
name: checks

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to check'
        required: true

concurrency:
  group: checks-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Cost control (owner 28 Oct, ready for a PRIVATE repo): integration builds
# (ci/b<number>) and manual runs always run EVERYTHING with 8 shards. Agent
# branches run only the suites their diff touches (vs origin/main) with 4
# shards; a docs-only push runs nothing. The integrator's ci/bNNN run is the
# full gate before anything reaches main.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.c.outputs.backend }}
      app: ${{ steps.c.outputs.app }}
      shards: ${{ steps.c.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      - id: c
        run: |
          REF='${{ github.event.inputs.ref || github.ref_name }}'
          if [ '${{ github.event_name }}' = workflow_dispatch ] || echo "$REF" | grep -Eq '^ci/b[0-9]+$'; then
            echo "full run ($REF)"; B=true; A=true; SH='[0,1,2,3,4,5,6,7]'
          else
            BASE=$(git merge-base HEAD origin/main 2>/dev/null || echo)
            if [ -z "$BASE" ]; then CH=ALL; else CH=$(git diff --name-only "$BASE" HEAD); fi
            echo "changed files:"; echo "$CH" | head -50
            B=false; A=false
            if [ "$CH" = ALL ] || echo "$CH" | grep -Eq '^(backend/|edge/|tools/e2e/|\.github/workflows/checks\.yml)'; then B=true; fi
            if [ "$CH" = ALL ] || echo "$CH" | grep -Eq '^(app/|\.phaseB/up_.*_arb\.json|\.github/workflows/checks\.yml)'; then A=true; fi
            SH='[0,1,2,3]'
          fi
          echo "backend=$B app=$A shards=$SH"
          { echo "backend=$B"; echo "app=$A"; echo "shards=$SH"; } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # tblib: Django's --parallel runner needs it to report a failing test;
      # without it one failure crashes the whole run ("cannot pickle traceback").
      - run: python -m pip install -q -r backend/requirements.txt tblib==3.0.0
      - name: makemigrations --check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --settings=assisto_backend.settings_test
      - name: core crm web
        working-directory: backend
        # A throwaway Fernet key made fresh on every run (never a real secret):
        # integration tests encrypt/decrypt with it. Locally the key comes from
        # the server's secrets file, which CI does not (and must not) have.
        run: |
          export INTEGRATIONS_FERNET_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          python manage.py test core crm web --settings=assisto_backend.settings_test --parallel 4 --noinput

  flutter-static:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: pub get + gen-l10n
        working-directory: app
        run: flutter pub get && flutter gen-l10n
      - name: analyze (errors fail; infos/warnings reported)
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: lang gate
        working-directory: app
        run: python3 tool/lang_gate.py

  flutter-test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: pub get + gen-l10n
        working-directory: app
        run: flutter pub get && flutter gen-l10n
      - name: flutter test shard ${{ matrix.shard }}/${{ strategy.job-total }}
        working-directory: app
        env:
          ASSISTO_SHOT_DIR: ${{ runner.temp }}/shots
        run: flutter test --no-pub --concurrency=2 --total-shards ${{ strategy.job-total }} --shard-index ${{ matrix.shard }}
      # gallery screenshots (before/after proof for the owner) — whatever the
      # shard's screenshot tests wrote; nothing uploaded when none ran
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.shard }}
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14
