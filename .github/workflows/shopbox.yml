name: Shop Box edge client (Windows)

on:
  push:
    paths:
      - "edge/shopbox/**"
      - ".github/workflows/shopbox.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: edge/shopbox

jobs:
  test:
    name: pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            edge/shopbox/requirements.txt
            edge/shopbox/requirements-dev.txt
            edge/shopbox/requirements-live.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-live.txt

      # Official YOLOX release asset; shopbox.model_fetch refuses it unless
      # the SHA-256 matches the value pinned in shopbox/model_fetch.py.
      - name: Download person model (SHA-256 verified)
        run: python -m shopbox.model_fetch models/yolox_nano.onnx

      - name: Run tests (backend contract tests use backend/core/logic/shop_guard.py)
        env:
          SHOPBOX_MODEL: models/yolox_nano.onnx
        run: python -m pytest -q

  build-windows:
    name: Build AssistoShopBox.exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            edge/shopbox/requirements.txt
            edge/shopbox/requirements-dev.txt
            edge/shopbox/requirements-live.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -r requirements-live.txt

      - name: Download person model (SHA-256 verified)
        run: python -m shopbox.model_fetch models/yolox_nano.onnx

      - name: PyInstaller (onedir, GUI + CLI executables)
        env:
          SHOPBOX_REQUIRE_MODEL: "1"
        run: pyinstaller --noconfirm --clean AssistoShopBox.spec

      - name: Smoke-test the frozen build (bundled model + onnxruntime load)
        shell: pwsh
        env:
          SHOPBOX_HOME: ${{ runner.temp }}\shopbox-smoke
        run: |
          $exe = "dist\AssistoShopBox\AssistoShopBoxCLI.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { Write-Error "detector did not load in frozen build"; exit 1 }
          if (-not (Test-Path "dist\AssistoShopBox\AssistoShopBox.exe")) { exit 1 }
          # optional live view: report, don't fail the build (monitoring works without it)
          & $exe --live-check
          if ($LASTEXITCODE -ne 0) { Write-Warning "live view (aiortc/av) not available in the frozen build" }
          $global:LASTEXITCODE = 0

      - name: Zip bundle
        shell: pwsh
        run: |
          Copy-Item README.md, README_bn.md dist\AssistoShopBox\
          Compress-Archive -Path dist\AssistoShopBox -DestinationPath dist\AssistoShopBox-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AssistoShopBox-windows-x64
          path: edge/shopbox/dist/AssistoShopBox-windows-x64.zip
          retention-days: 30

  # cctvtoday: a REAL download path for the PC program (owner order 9 Nov).
  # The zip goes to the fixed pre-release `shopbox-windows` (stable URL, no
  # GitHub login needed on a public repo) with shopbox-latest.json (version,
  # SHA-256, size) that lifeassisto.com/get and the app show. Unsigned exe:
  # the page says Windows SmartScreen may warn. Binaries are never committed.
  publish:
    name: Publish AssistoShopBox (GitHub release asset)
    needs: build-windows
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/cctvtoday-arb'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: AssistoShopBox-windows-x64
          path: ${{ runner.temp }}/sb
      - name: Manifest + upload (manifest last)
        env:
          GH_TOKEN: ${{ github.token }}
          SB: ${{ runner.temp }}/sb
        run: |
          set -e
          Z="$SB/AssistoShopBox-windows-x64.zip"
          test -s "$Z"
          V=$(python3 -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('shopbox/__init__.py').read()).group(1))")
          python3 - "$Z" "$V" "$SB/shopbox-latest.json" <<'PY'
          import hashlib, json, os, sys, datetime
          z, v, out = sys.argv[1:4]
          h = hashlib.sha256(open(z, "rb").read()).hexdigest()
          repo = os.environ["GITHUB_REPOSITORY"]
          json.dump({"version": "%s+%s" % (v, os.environ["GITHUB_RUN_NUMBER"]),
                     "sha256": h, "size_bytes": os.path.getsize(z),
                     "file": os.path.basename(z), "commit": os.environ["GITHUB_SHA"][:10],
                     "built_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%MZ"),
                     "signed": False,
                     "url": "https://github.com/%s/releases/download/shopbox-windows/%s"
                            % (repo, os.path.basename(z))}, open(out, "w"), indent=1)
          print(open(out).read())
          PY
          gh release view shopbox-windows >/dev/null 2>&1 || gh release create shopbox-windows \
            --prerelease --title "Assisto Shop Box for Windows PC (CCTV gateway)" \
            --notes "The Assisto Shop Box PC program (CCTV gateway). Unzip, run AssistoShopBox.exe, paste the pairing code from the Assisto app. Not code-signed yet: Windows SmartScreen may warn — More info -> Run anyway. Check the SHA-256 in shopbox-latest.json."
          gh release upload shopbox-windows "$Z" --clobber
          gh release upload shopbox-windows "$SB/shopbox-latest.json" --clobber
