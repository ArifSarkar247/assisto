name: Build Assisto APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend base URL baked into the app"
        required: false
        default: "https://api.lifeassisto.com"
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # API CONTRACT GATE (m2-reality): every endpoint the Flutter app calls
      # (literal + string-built paths, ${id} normalised) must resolve to a
      # Django route that handles that HTTP method (DRF router actions and
      # <int>/<str>/<slug>/<uuid> converter shapes included). A miss means a
      # screen that can never work -> fail before spending 20 min on Gradle.
      # No DB, no network: URL resolution only, under settings_test.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API contract (every app endpoint has a backend route)
        env:
          DJANGO_SETTINGS_MODULE: assisto_backend.settings_test
        run: |
          python -m pip install -q -r backend/requirements.txt
          timeout 600 python tools/route_check.py --md route_check.md
      - name: Upload API contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-report
          path: route_check.md
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --project-name assisto --org com.assisto --platforms=android .

      - name: Apply native overlay (custom Kotlin/res for native features)
        working-directory: app
        run: |
          # Native platform code (device-admin receiver #80, foreground service
          # #79, home-widget provider #196, Health Connect bits #70) lives in the
          # repo under app/android_overlay/ and is MERGED over the freshly
          # generated android/ tree. Paths mirror android/ exactly (e.g.
          # android_overlay/app/src/main/kotlin/... , .../res/xml/...). No-op if
          # the overlay is absent.
          if [ -d android_overlay ]; then
            cp -rv android_overlay/. android/
            echo "native overlay applied"
          else
            echo "no android_overlay — skipping"
          fi

      # a6 FCM: Firebase config is KEY-GATED. google-services.json lives ONLY in
      # the GOOGLE_SERVICES_JSON_B64 Actions secret (repo is public — never
      # commit it, never print it). No secret -> no file -> the Gradle plugin is
      # not applied, Firebase.initializeApp() fails inside its try/catch and the
      # app builds + launches with push silently off.
      - name: Firebase config (google-services.json from secret)
        working-directory: app
        env:
          GSJ_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "${GSJ_B64:-}" ]; then
            printf '%s' "$GSJ_B64" | base64 -d > android/app/google-services.json
            python3 - <<'PY2'
          import json
          d = json.load(open("android/app/google-services.json"))
          pk = [c["client_info"]["android_client_info"]["package_name"] for c in d.get("client", [])]
          assert "com.assisto.assisto" in pk, "google-services.json has no com.assisto.assisto client"
          print("google-services.json OK for project", d["project_info"]["project_id"])
          PY2
          else
            echo "no GOOGLE_SERVICES_JSON_B64 secret - push stays OFF in this build"
          fi

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze (fail only on errors)
        working-directory: app
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          cat analyze.txt
          if grep -qE "error •| error -|: error" analyze.txt; then
            echo "::error::Dart analysis found errors"; exit 1; fi
          echo "no errors"

      - name: Strict language gate (no mixed/hard-coded UI strings)
        working-directory: app
        run: python3 tool/lang_gate.py

      # First-run gate: the language picker → "Continue" → enter-app flow must
      # work deterministically (the owner-reported freeze where Continue did
      # nothing shipped because nothing proved this flow). Host-side widget test,
      # no emulator — gates the whole pipeline, so a broken Continue can't ship.
      - name: First-run language flow test (Continue must enter the app)
        working-directory: app
        # db1: + dead-button sweep (every gallery screen, every enabled tap must
        # do something) and the swallowed-catch static check.
        run: flutter test test/language_flow_test.dart test/widget_test.dart test/swallowed_catch_test.dart test/dead_button_sweep_test.dart

      - name: Generate launcher icons (adaptive)
        working-directory: app
        run: dart run flutter_launcher_icons

      - name: Generate splash screen
        working-directory: app
        run: dart run flutter_native_splash:create

      - name: Patch manifest (app name + permissions)
        working-directory: app
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace('android:label="assisto"', 'android:label="Assisto"')
          # tools: namespace for tools:node overrides.
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          perms = (
              '\n    <uses-permission android:name="android.permission.INTERNET"/>'
              '\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>'
              '\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>'
              '\n    <uses-permission android:name="android.permission.CAMERA"/>'
              # CCTV Part 4 live view (flutter_webrtc): network monitor + audio routing
              '\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'
              '\n    <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>'
              '\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>'
              '\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>'
              '\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>'
              '\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'
              '\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>'
              # #79 hands-free voice SOS — foreground service (mic + location)
              '\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>'
              '\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>'
              '\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>'
              '\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
              '\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>'
              # #70 Health Connect reads
              '\n    <uses-permission android:name="android.permission.ACTIVITY_RECOGNITION"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_STEPS"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_HEART_RATE"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_SLEEP"/>'
              '\n    <uses-permission android:name="android.permission.health.READ_ACTIVE_CALORIES_BURNED"/>'
              # #80 lost/stolen — alarm vibration
              '\n    <uses-permission android:name="android.permission.VIBRATE"/>'
              # c1-contacts — read the phonebook ONLY after the in-app disclosure
              '\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>'
              # Part 3 Assisto Voice (a3-voice): CALL_PHONE asked ONLY when the
              # user confirms a call; SET_ALARM is a normal permission.
              '\n    <uses-permission android:name="android.permission.CALL_PHONE"/>'
              '\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>'
              # v1-vehicle: ELM327 OBD dongle over classic Bluetooth (bonded
              # devices only, we never scan). CONNECT is a runtime permission on
              # 12+, requested lazily from the OBD screen; legacy pair <= 11.
              '\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>'
              '\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>'
              '\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>\n'
          )
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1' + perms, s, count=1)
          queries = (
              '\n    <queries>'
              '\n      <intent><action android:name="android.intent.action.DIAL"/>'
              '<data android:scheme="tel"/></intent>'
              '\n      <intent><action android:name="android.intent.action.SENDTO"/>'
              '<data android:scheme="smsto"/></intent>'
              '\n      <intent><action android:name="android.intent.action.VIEW"/></intent>'
              # #70 Health Connect visibility (so the app can resolve HC)
              '\n      <package android:name="com.google.android.apps.healthdata"/>'
              # Part 3 Assisto Voice: "open <app>", TTS engines + recognizers
              # (needed on API 30+), music / WhatsApp hand-off.
              '\n      <intent><action android:name="android.intent.action.MAIN"/>'
              '<category android:name="android.intent.category.LAUNCHER"/></intent>'
              '\n      <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>'
              '\n      <intent><action android:name="android.speech.RecognitionService"/></intent>'
              '\n      <package android:name="com.google.android.youtube"/>'
              '\n      <package android:name="com.google.android.apps.youtube.music"/>'
              '\n      <package android:name="com.spotify.music"/>'
              '\n      <package android:name="com.whatsapp"/>'
              # tl1 OEM background guide: vendor settings apps + the two
              # Settings screens, so resolveActivity can verify a screen
              # exists before an "Open" button is shown (API 30+ visibility).
              '\n      <intent><action android:name="android.settings.IGNORE_BATTERY_OPTIMIZATION_SETTINGS"/></intent>'
              '\n      <intent><action android:name="android.settings.APPLICATION_DETAILS_SETTINGS"/>'
              '<data android:scheme="package"/></intent>'
              '\n      <intent><action android:name="miui.intent.action.OP_AUTO_START"/></intent>'
              '\n      <package android:name="com.miui.securitycenter"/>'
              '\n      <package android:name="com.miui.powerkeeper"/>'
              '\n      <package android:name="com.coloros.safecenter"/>'
              '\n      <package android:name="com.oppo.safe"/>'
              '\n      <package android:name="com.coloros.oppoguardelf"/>'
              '\n      <package android:name="com.oneplus.security"/>'
              '\n      <package android:name="com.vivo.permissionmanager"/>'
              '\n      <package android:name="com.iqoo.secure"/>'
              '\n      <package android:name="com.vivo.abe"/>'
              '\n      <package android:name="com.iqoo.powersaving"/>'
              '\n      <package android:name="com.samsung.android.lool"/>'
              '\n      <package android:name="com.samsung.android.sm"/>'
              '\n      <package android:name="com.transsion.phonemaster"/>'
              '\n    </queries>\n'
          )
          # flutter create ALREADY writes a <queries> block (PROCESS_TEXT), so
          # "only if no <queries>" never added ours (link/dialer/Health Connect
          # visibility silently missing on Android 11+). Merge our entries into
          # the existing block instead; a fresh block only if there is none.
          if 'com.google.android.apps.healthdata' not in s:
              inner = queries.split('<queries>', 1)[1].rsplit('</queries>', 1)[0]
              if '</queries>' in s:
                  s = s.replace('</queries>', inner.rstrip() + '\n    </queries>', 1)
              else:
                  s = re.sub(r'(<manifest[^>]*>)', r'\1' + queries, s, count=1)
          # image_cropper needs UCropActivity registered INSIDE <application>,
          # else cropping crashes at runtime (ActivityNotFoundException). Give it
          # an explicit AppCompat theme so the app theme need not be AppCompat.
          ucrop = (
              '\n        <activity android:name="com.yalantis.ucrop.UCropActivity"'
              ' android:exported="false"'
              ' android:theme="@style/Theme.AppCompat.Light.NoActionBar"/>\n'
          )
          if 'com.yalantis.ucrop.UCropActivity' not in s:
              s = s.replace('</application>', ucrop + '    </application>', 1)
          # Native-feature <application> components (classes live in the overlay):
          #   #79 voice-SOS foreground service (flutter_foreground_task),
          #   #196 home-screen widget provider, #80 device-admin receiver.
          native_components = (
              '\n        <service'
              ' android:name="com.pravera.flutter_foreground_task.service.ForegroundService"'
              ' android:foregroundServiceType="microphone|location"'
              ' android:exported="false"/>'
              '\n        <receiver android:name=".AssistoWidgetProvider"'
              ' android:exported="false">'
              '\n            <intent-filter>'
              '\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>'
              '\n            </intent-filter>'
              '\n            <meta-data android:name="android.appwidget.provider"'
              ' android:resource="@xml/assisto_widget_info"/>'
              '\n        </receiver>'
              '\n        <receiver'
              ' android:name="com.assisto.assisto.AssistoDeviceAdminReceiver"'
              ' android:permission="android.permission.BIND_DEVICE_ADMIN"'
              ' android:exported="true">'
              '\n            <meta-data android:name="android.app.device_admin"'
              ' android:resource="@xml/device_admin"/>'
              '\n            <intent-filter>'
              '\n                <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>'
              '\n            </intent-filter>'
              '\n        </receiver>'
              # ---- a3-voice: Part 3 Assisto Voice ----
              # Default digital assistant (VoiceInteractionService): long-press
              # power / home / corner swipe open Assisto Voice, also over the
              # lock screen. The platform REQUIRES a recognitionService; ours
              # proxies to the phone's real recognizer so STT keeps working.
              '\n        <service android:name="com.assisto.assisto.voice.AssistoVoiceInteractionService"'
              ' android:permission="android.permission.BIND_VOICE_INTERACTION"'
              ' android:exported="true">'
              '\n            <meta-data android:name="android.voice_interaction"'
              ' android:resource="@xml/assisto_voice_interaction"/>'
              '\n            <intent-filter>'
              '\n                <action android:name="android.service.voice.VoiceInteractionService"/>'
              '\n            </intent-filter>'
              '\n        </service>'
              '\n        <service android:name="com.assisto.assisto.voice.AssistoVoiceSessionService"'
              ' android:permission="android.permission.BIND_VOICE_INTERACTION"'
              ' android:exported="true"/>'
              '\n        <service android:name="com.assisto.assisto.voice.AssistoRecognitionService"'
              ' android:exported="true">'
              '\n            <intent-filter>'
              '\n                <action android:name="android.speech.RecognitionService"/>'
              '\n                <category android:name="android.intent.category.DEFAULT"/>'
              '\n            </intent-filter>'
              '\n            <meta-data android:name="android.speech"'
              ' android:resource="@xml/assisto_recognition"/>'
              '\n        </service>'
              # Fallback ACTION_ASSIST / headset VOICE_COMMAND entry (no UI).
              '\n        <activity android:name="com.assisto.assisto.voice.AssistEntryActivity"'
              ' android:exported="true" android:excludeFromRecents="true"'
              ' android:noHistory="true" android:launchMode="singleTop"'
              ' android:theme="@android:style/Theme.Translucent.NoTitleBar">'
              '\n            <intent-filter>'
              '\n                <action android:name="android.intent.action.ASSIST"/>'
              '\n                <category android:name="android.intent.category.DEFAULT"/>'
              '\n            </intent-filter>'
              '\n            <intent-filter>'
              '\n                <action android:name="android.intent.action.VOICE_COMMAND"/>'
              '\n                <category android:name="android.intent.category.DEFAULT"/>'
              '\n            </intent-filter>'
              '\n        </activity>'
              # ---- l1-launch: Health Connect privacy-policy entry ----
              '\n        <activity android:name="com.assisto.assisto.legal.PrivacyPolicyActivity"'
              ' android:exported="true" android:excludeFromRecents="true"'
              ' android:noHistory="true"'
              ' android:theme="@android:style/Theme.Translucent.NoTitleBar">'
              '\n            <intent-filter>'
              '\n                <action android:name="androidx.health.ACTION_SHOW_PERMISSIONS_RATIONALE"/>'
              '\n            </intent-filter>'
              '\n        </activity>'
              '\n        <activity-alias android:name="com.assisto.assisto.legal.ViewPermissionUsageActivity"'
              ' android:exported="true"'
              ' android:targetActivity="com.assisto.assisto.legal.PrivacyPolicyActivity"'
              ' android:permission="android.permission.START_VIEW_PERMISSION_USAGE">'
              '\n            <intent-filter>'
              '\n                <action android:name="android.intent.action.VIEW_PERMISSION_USAGE"/>'
              '\n                <category android:name="android.intent.category.HEALTH_PERMISSIONS"/>'
              '\n            </intent-filter>'
              '\n        </activity-alias>'
              # Opt-in "Hey/Hi Assisto" wake word (never started at launch/boot;
              # the Porcupine engine itself ships in stage 2, by reflection).
              '\n        <service android:name="com.assisto.assisto.voice.WakeWordService"'
              ' android:foregroundServiceType="microphone"'
              ' android:exported="false"/>\n'
          )
          if '.AssistoWidgetProvider' not in s:
              s = s.replace('</application>', native_components + '    </application>', 1)
          # LAUNCH-ANR FIX: disable androidx.startup auto-initialization. This
          # phone (Realme/ColorOS) ANR'd at process start on the androidx
          # WorkManager startup ContentProvider before; androidx.camera (CameraX)
          # now pulls androidx.startup too. Removing the InitializationProvider
          # makes those libs lazy-init (CameraX inits on first use;
          # profileinstaller baseline profiles are a skippable perf optimisation)
          # so NOTHING heavy runs via a ContentProvider at cold start.
          startup_remove = (
              '\n        <provider android:name="androidx.startup.InitializationProvider"'
              ' android:authorities="${applicationId}.androidx-startup"'
              ' tools:node="remove"/>\n'
          )
          if 'androidx.startup.InitializationProvider' not in s:
              s = s.replace('</application>', startup_remove + '    </application>', 1)
          # ---- a6 FCM push ----
          # Full-screen incoming calls (Android 14+: user-grantable special
          # permission; Settings -> Notifications & calls deep-links to it).
          if 'USE_FULL_SCREEN_INTENT' not in s:
              s = re.sub(r'(<manifest[^>]*>)', r'\1' +
                  '\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT"/>'
                  '\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n',
                  s, count=1)
          # NO android:showWhenLocked / turnScreenOn on MainActivity: that would
          # show the whole app (chats, vault) on a locked phone. MainActivity
          # grants it per launch, only for a ringing call (see MainActivity.kt).
          push_components = (
              # NO startup ContentProvider: Firebase is initialised lazily (Dart
              # after the first frame; native AssistoFcmService when a push
              # arrives with the app closed).
              '\n        <provider android:name="com.google.firebase.provider.FirebaseInitProvider"'
              ' android:authorities="${applicationId}.firebaseinitprovider"'
              ' tools:node="remove"/>'
              # firebase_messaging's own startup provider only stores the app
              # context; the plugin's receiver, engine attach and our service
              # set the same holder, so it goes too (no startup providers).
              '\n        <provider android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingInitProvider"'
              ' android:authorities="${applicationId}.flutterfirebasemessaginginitprovider"'
              ' tools:node="remove"/>'
              # swap the plugin's messaging service for our subclass (it inits
              # Firebase on demand, crash-guarded)
              '\n        <service android:name="io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService"'
              ' tools:node="remove"/>'
              '\n        <service android:name="com.assisto.assisto.push.AssistoFcmService"'
              ' android:exported="false">'
              '\n            <intent-filter>'
              '\n                <action android:name="com.google.firebase.MESSAGING_EVENT"/>'
              '\n            </intent-filter>'
              '\n        </service>'
              # notification messages that arrive before the app created its
              # channels land on "alerts" (channels are created in Dart:
              # messages / calls / reminders / alerts / sos)
              '\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id"'
              ' android:value="alerts"/>'
              # flutter_local_notifications receivers: notification ACTIONS
              # (call Accept/Decline) + scheduled reminders + reschedule on boot.
              # (The scheduled receivers were missing before, so zonedSchedule
              # reminders could not fire.)
              '\n        <receiver android:exported="false"'
              ' android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver"/>'
              '\n        <receiver android:exported="false"'
              ' android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>'
              '\n        <receiver android:exported="false"'
              ' android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">'
              '\n            <intent-filter>'
              '\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>'
              '\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>'
              '\n                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>'
              '\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>'
              '\n            </intent-filter>'
              '\n        </receiver>\n'
          )
          if 'AssistoFcmService' not in s:
              s = s.replace('</application>', push_components + '    </application>', 1)
          # ---- w1-webphoto ---- Android App Link on MainActivity:
          # https://lifeassisto.com/photo/app?t=<token> opens the website
          # passport photo in Photo Studio. Flutter's built-in deep linking
          # (flutter_deeplinking_enabled defaults to true) hands the URL to Dart;
          # no plugin. autoVerify needs /.well-known/assetlinks.json on the host.
          applink = (
              '\n            <intent-filter android:autoVerify="true">'
              '\n                <action android:name="android.intent.action.VIEW"/>'
              '\n                <category android:name="android.intent.category.DEFAULT"/>'
              '\n                <category android:name="android.intent.category.BROWSABLE"/>'
              '\n                <data android:scheme="https" android:host="lifeassisto.com"'
              ' android:pathPrefix="/photo/app"/>'
              '\n            </intent-filter>\n        '
          )
          if 'android:pathPrefix="/photo/app"' not in s:
              i = s.find('android:name=".MainActivity"')
              j = s.find('</activity>', i) if i != -1 else -1
              if j != -1:
                  s = s[:j] + applink + s[j:]
          # ---- c3-msg ---- chat bubbles (Android 11+ Bubbles API): the bubble
          # expands this activity, so it must be embeddable + resizeable and
          # launch as its own document (several bubbles at once). Not
          # exported; only our own mutable PendingIntent opens it. Never
          # started at launch. No SYSTEM_ALERT_WINDOW.
          bubble_activity = (
              '\n        <activity android:name="com.assisto.assisto.messaging.BubbleActivity"'
              ' android:exported="false"'
              ' android:allowEmbedded="true"'
              ' android:resizeableActivity="true"'
              ' android:documentLaunchMode="always"'
              ' android:hardwareAccelerated="true"'
              ' android:windowSoftInputMode="adjustResize"'
              ' android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"'
              ' android:theme="@style/LaunchTheme">'
              '\n            <meta-data android:name="io.flutter.embedding.android.NormalTheme"'
              ' android:resource="@style/NormalTheme"/>'
              '\n        </activity>\n'
          )
          if 'messaging.BubbleActivity' not in s:
              s = s.replace('</application>', bubble_activity + '    </application>', 1)
          # ---- c2-calls ---- video calls can shrink to picture-in-picture
          # (Flutter's default MainActivity configChanges already include
          # orientation|screenSize|smallestScreenSize|screenLayout).
          if 'android:supportsPictureInPicture' not in s:
              i = s.find('android:name=".MainActivity"')
              if i != -1:
                  s = s[:i] + 'android:supportsPictureInPicture="true"\n            ' + s[i:]
          open(p, "w").write(s)
          print("manifest patched: label, permissions, queries, UCropActivity, native components, androidx.startup removed, FCM push, chat bubbles, PiP")
          PY

      - name: Patch iOS Info.plist (camera/mic/photos usage strings)
        working-directory: app
        run: |
          python3 - <<'PY'
          import os
          p = "ios/Runner/Info.plist"
          if not os.path.exists(p):
              print("no iOS project (android-only build) — skipping Info.plist patch")
          else:
              s = open(p).read()
              entries = {
                  "NSCameraUsageDescription":
                      "Assisto uses the camera so you can take photos and record "
                      "videos to share with your circle or post as a status.",
                  "NSMicrophoneUsageDescription":
                      "Assisto uses the microphone to record audio while you shoot "
                      "a video to share with your circle.",
                  "NSPhotoLibraryUsageDescription":
                      "Assisto needs your photos so you can pick an existing picture "
                      "or video to share with your circle or post as a status.",
              }
              inject = ""
              for k, v in entries.items():
                  if k not in s:
                      inject += f"\t<key>{k}</key>\n\t<string>{v}</string>\n"
              if inject:
                  s = s.replace("</dict>\n</plist>", inject + "</dict>\n</plist>", 1)
                  open(p, "w").write(s)
                  print("Info.plist patched: camera/mic/photos usage strings")
              else:
                  print("Info.plist already has usage strings")
          PY

      - name: Enable core library desugaring (flutter_local_notifications)
        working-directory: app
        run: |
          python3 - <<'PY'
          import os
          kts = "android/app/build.gradle.kts"
          gr = "android/app/build.gradle"
          p, is_kts = (kts, True) if os.path.exists(kts) else (gr, False)
          s = open(p).read()
          # Force minSdk 26 (Android 8.0): the Health Connect plugin (#70) requires
          # 26; older plugins (file_picker / lifecycle / notifications) need 23. 26
          # covers ~96%+ of active devices in 2026 and old Android 6-7 phones can't
          # run Health Connect anyway.
          # strip any existing minSdk line, then inject into defaultConfig.
          import re as _re
          s = _re.sub(r'\n[ \t]*minSdk[A-Za-z]*\s*=?[^\n]*', '', s)
          inject = '\n        minSdk = 26' if is_kts else '\n        minSdkVersion 26'
          s = s.replace('defaultConfig {', 'defaultConfig {' + inject, 1)
          # compileSdk 36 (required by flutter_plugin_android_lifecycle)
          s = _re.sub(r'\n[ \t]*compileSdk[A-Za-z]*\s*=?[^\n]*', '', s)
          cinject = '\n    compileSdk = 36' if is_kts else '\n    compileSdk 36'
          s = s.replace('android {', 'android {' + cinject, 1)
          print("sdk lines now:",
                [l.strip() for l in s.splitlines() if 'Sdk' in l])
          if "coreLibraryDesugaring" not in s:
              if is_kts:
                  s = s.replace("compileOptions {",
                      "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
                  s += ('\n\ndependencies {\n    coreLibraryDesugaring('
                        '"com.android.tools:desugar_jdk_libs:2.1.4")\n'
                        # a6 FCM: AssistoFcmService (android_overlay) extends the
                        # plugin's service; the plugins pull Firebase in as
                        # `implementation`, so the app module declares it too.
                        '    implementation(platform("com.google.firebase:firebase-bom:34.19.0"))\n'
                        '    implementation("com.google.firebase:firebase-messaging")\n}\n')
              else:
                  s = s.replace("compileOptions {",
                      "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
                  s += ("\n\ndependencies {\n    coreLibraryDesugaring "
                        "'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                        "    implementation platform('com.google.firebase:firebase-bom:34.19.0')\n"
                        "    implementation 'com.google.firebase:firebase-messaging'\n}\n")
              open(p, "w").write(s)
              print("desugaring enabled in", p)
          else:
              print("already enabled")
          PY

      - name: Apply google-services Gradle plugin (only when Firebase config exists)
        working-directory: app
        run: |
          python3 - <<'PY'
          import os, re
          if not os.path.exists("android/app/google-services.json"):
              print("no google-services.json - google-services plugin NOT applied (push off)")
              raise SystemExit(0)
          GMS = "4.5.0"
          for settings in ("android/settings.gradle.kts", "android/settings.gradle"):
              if os.path.exists(settings):
                  s = open(settings).read()
                  if "com.google.gms.google-services" not in s:
                      kts = settings.endswith(".kts")
                      line = ('    id("com.google.gms.google-services") version "%s" apply false' % GMS
                              if kts else
                              '    id "com.google.gms.google-services" version "%s" apply false' % GMS)
                      s, n = re.subn(r'(\n[ \t]*id[ (]+"dev\.flutter\.flutter-plugin-loader"[^\n]*)',
                                     lambda m: m.group(1) + "\n" + line, s, count=1)
                      assert n == 1, "plugin-loader line not found in " + settings
                      open(settings, "w").write(s)
                  print("google-services plugin declared in", settings)
                  break
          for app in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(app):
                  s = open(app).read()
                  if "com.google.gms.google-services" not in s:
                      kts = app.endswith(".kts")
                      line = ('    id("com.google.gms.google-services")' if kts
                              else '    id "com.google.gms.google-services"')
                      s, n = re.subn(r'(\n[ \t]*id[ (]+"dev\.flutter\.flutter-gradle-plugin"[^\n]*)',
                                     lambda m: m.group(1) + "\n" + line, s, count=1)
                      assert n == 1, "flutter-gradle-plugin line not found in " + app
                      open(app, "w").write(s)
                  print("google-services plugin applied in", app)
                  break
          PY

      # ---- sc1 ---- crash reporting (proposal: .phaseB/proposals/sc1.md)
      #  * Crashlytics collection OFF by manifest meta-data; the app turns it on
      #    only after sign-in + onboarding (lib/diag/crash_boot.dart).
      #  * NO startup ContentProvider is added: firebase-crashlytics 20.1.1,
      #    firebase-sessions 3.0.8, transport-runtime 3.3.0 and the
      #    firebase_crashlytics 5.4.0 plugin declare only ComponentDiscoveryService
      #    registrars / a JobService / a receiver (checked from their AARs);
      #    FirebaseInitProvider stays removed (a6 step above).
      #  * Crashlytics Gradle plugin 3.0.8 only when google-services.json exists;
      #    mapping upload OFF (no network/secret dependency in the build).
      - name: Crash reporting (sc1)
        working-directory: app
        run: |
          python3 - <<'PY'
          import os, re
          m = "android/app/src/main/AndroidManifest.xml"
          x = open(m).read()
          if 'xmlns:tools' not in x:
              x = x.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'firebase_crashlytics_collection_enabled' not in x:
              x = x.replace('</application>',
                  '\n        <meta-data android:name="firebase_crashlytics_collection_enabled"'
                  ' android:value="false"/>\n    </application>', 1)
          open(m, "w").write(x)
          print("manifest: crashlytics collection off by default")
          if not os.path.exists("android/app/google-services.json"):
              print("no google-services.json - Crashlytics Gradle plugin NOT applied (crash reports go to our server only)")
              raise SystemExit(0)
          CR = "3.0.8"
          for settings in ("android/settings.gradle.kts", "android/settings.gradle"):
              if os.path.exists(settings):
                  s = open(settings).read()
                  if "com.google.firebase.crashlytics" not in s:
                      kts = settings.endswith(".kts")
                      line = ('    id("com.google.firebase.crashlytics") version "%s" apply false' % CR
                              if kts else
                              '    id "com.google.firebase.crashlytics" version "%s" apply false' % CR)
                      s, n = re.subn(r'(\n[ \t]*id[ (]+"com\.google\.gms\.google-services"[^\n]*)',
                                     lambda mm: mm.group(1) + "\n" + line, s, count=1)
                      assert n == 1, "google-services line not found in " + settings
                      open(settings, "w").write(s)
                  print("crashlytics plugin declared in", settings)
                  break
          for app in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              if os.path.exists(app):
                  s = open(app).read()
                  if "com.google.firebase.crashlytics" not in s:
                      kts = app.endswith(".kts")
                      line = ('    id("com.google.firebase.crashlytics")' if kts
                              else '    id "com.google.firebase.crashlytics"')
                      s, n = re.subn(r'(\n[ \t]*id[ (]+"com\.google\.gms\.google-services"[^\n]*)',
                                     lambda mm: mm.group(1) + "\n" + line, s, count=1)
                      assert n == 1, "google-services line not found in " + app
                      if kts:
                          s += ('\n\nandroid {\n    buildTypes {\n        getByName("release") {\n'
                                '            configure<com.google.firebase.crashlytics.buildtools.gradle.CrashlyticsExtension> {\n'
                                '                mappingFileUploadEnabled = false\n            }\n        }\n    }\n}\n')
                      else:
                          s += ('\n\nandroid {\n    buildTypes {\n        release {\n'
                                '            firebaseCrashlytics { mappingFileUploadEnabled false }\n'
                                '        }\n    }\n}\n')
                      open(app, "w").write(s)
                  print("crashlytics plugin applied in", app, "(mapping upload off)")
                  break
          PY
      # ---- /sc1 ----
      # ---- p2-photo ---- Photo Studio on-device AI (proposal: .phaseB/proposals/p2-photo.md)
      #  * ONNX Runtime Android 1.23.2 (MIT) — the SAME version/guard as k1-wake,
      #    so the app ships one runtime even when both branches are merged;
      #  * ML Kit face detection 16.1.7, BUNDLED model (offline, ML Kit terms:
      #    free incl. commercial use) — landmarks for the identity check, face
      #    boxes for the skin mask / face-lock;
      #  * ML Kit's startup ContentProvider (MlKitInitProvider) is REMOVED: no
      #    startup providers (ColorOS launch history). PhotoFaces.kt calls
      #    MlKit.initialize() on the first face request instead.
      - name: Photo Studio native deps (p2-photo)
        working-directory: app
        run: |
          python3 - <<'PY'
          import os
          kts = "android/app/build.gradle.kts"
          p, is_kts = (kts, True) if os.path.exists(kts) else ("android/app/build.gradle", False)
          s = open(p).read()
          deps = []
          if "onnxruntime-android" not in s:
              deps.append("com.microsoft.onnxruntime:onnxruntime-android:1.23.2")
          if "com.google.mlkit:face-detection" not in s:
              deps.append("com.google.mlkit:face-detection:16.1.7")
          if deps:
              body = "".join(('    implementation("%s")\n' if is_kts else "    implementation '%s'\n") % d
                             for d in deps)
              s += "\n\ndependencies {\n" + body + "}\n"
              open(p, "w").write(s)
          print("photo deps:", deps or "already present", "in", p)
          m = "android/app/src/main/AndroidManifest.xml"
          x = open(m).read()
          if "MlKitInitProvider" not in x:
              if 'xmlns:tools' not in x:
                  x = x.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
              x = x.replace('</application>',
                  '\n        <provider android:name="com.google.mlkit.common.internal.MlKitInitProvider"'
                  ' android:authorities="${applicationId}.mlkitinitprovider"'
                  ' tools:node="remove"/>\n    </application>', 1)
              open(m, "w").write(x)
              print("MlKitInitProvider removed (lazy MlKit.initialize in PhotoFaces.kt)")
          PY
      # ---- /p2-photo ----
      # ---- pay1 ---- the website APK never uses Google Play Billing: drop the
      # BILLING permission the in_app_purchase plugin merges in (the Play AAB
      # step below puts it back). Nothing calls Play Billing on this build
      # anyway (AppConfig.playStore is false; the plugin is a deferred import).
      - name: Website APK manifest — no Play Billing permission (pay1)
        working-directory: app
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if 'xmlns:tools=' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          line = '<uses-permission android:name="com.android.vending.BILLING" tools:node="remove"/>'
          if line not in s:
              import re
              s = re.sub(r'(<manifest[^>]*>)', r'\1\n    ' + line, s, count=1)
          open(p, "w").write(s)
          print("APK manifest: com.android.vending.BILLING removed")
          PY
      # ---- /pay1 ----

      - name: Build release APK (arm64 only)
        working-directory: app
        run: |
          API_BASE="${{ github.event.inputs.api_base || 'https://api.lifeassisto.com' }}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%MZ)"
          flutter build apk --release \
            --target-platform=android-arm64 \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=API_BASE="$API_BASE" \
            --dart-define=BUILD_TIME="$BUILD_TIME"

      - name: Build x86_64 RELEASE APK (emulator smoke test only — NOT shipped)
        working-directory: app
        run: |
          # The shipped APK is arm64-only; x86_64 emulators can't load it. This
          # x64 build is a RELEASE build (R8 shrinking, AOT) like the shipped one:
          # builds 147-150 broke SharedPreferences ONLY in release (R8), which a
          # debug smoke APK could never catch. The arm64 release output is kept
          # aside and restored, so the signing step still ships arm64.
          REL=build/app/outputs/flutter-apk/app-release.apk
          cp "$REL" /tmp/arm64-release.apk
          flutter build apk --release --target-platform=android-x64 \
            --dart-define=ASSISTO_SMOKE=true \
            --dart-define=API_BASE="${{ github.event.inputs.api_base || 'https://api.lifeassisto.com' }}" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%MZ)"
          cp "$REL" emu-x64.apk
          cp /tmp/arm64-release.apk "$REL"
          unzip -l "$REL" | grep -q "lib/arm64-v8a/" || { echo "::error::shipped APK is not arm64"; exit 1; }
          unzip -l emu-x64.apk | grep -q "lib/x86_64/" || { echo "::error::smoke APK is not x86_64"; exit 1; }

      - name: Upload emulator smoke APK
        uses: actions/upload-artifact@v4
        with:
          name: assisto-apk-emu
          path: app/emu-x64.apk
          retention-days: 3

      - name: Sign APK with permanent release key
        working-directory: app
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p out
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > /tmp/ks.p12
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          SRC=build/app/outputs/flutter-apk/app-release.apk
          "${BT}zipalign" -f -p 4 "$SRC" /tmp/aligned.apk
          OUT="out/assisto-part7-build${{ github.run_number }}.apk"
          "${BT}apksigner" sign \
            --ks /tmp/ks.p12 --ks-type PKCS12 \
            --ks-pass pass:"$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass pass:"$KEY_PASS" \
            --out "$OUT" /tmp/aligned.apk
          "${BT}apksigner" verify --print-certs "$OUT" | head -5
          rm -f /tmp/ks.p12 /tmp/aligned.apk
          ls -la out
          echo "size: $(du -h "$OUT" | cut -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assisto-apk
          path: app/out/*.apk
          retention-days: 14

      # ---- l1-launch: Google Play release bundle ----
      # Runs AFTER the website APK is built, signed and uploaded, so nothing
      # above changes. It is the PLAY build: PLAY_STORE=true turns the in-app
      # updater off (Play forbids self-updates) and REQUEST_INSTALL_PACKAGES is
      # removed from the merged manifest. Signed with the Play UPLOAD key when
      # the PLAY_UPLOAD_* secrets exist, else with the existing release key
      # (see owner_actions/PLAY_APP_SIGNING.md for which to choose).
      - name: Build + sign release AAB (Google Play)
        id: aab
        continue-on-error: true      # first rollout: never block the APK release
        working-directory: app
        env:
          UP_KS_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_B64 }}
          UP_KS_PASS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          UP_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          UP_KEY_PASS: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          REL_KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          REL_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REL_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REL_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # 1) Play manifest: drop the self-update permission even if a plugin
          #    contributes it (tools:node="remove" wins in the merger).
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          s = s.replace('<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>',
                        '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" tools:node="remove"/>')
          assert 'REQUEST_INSTALL_PACKAGES" tools:node="remove"' in s, "manifest patch not found"
          open(p, "w").write(s)
          print("Play manifest: REQUEST_INSTALL_PACKAGES removed")
          # ---- pay1 ---- the Play build DOES use Play Billing: undo the APK-only removal
          s = open(p).read()
          s = s.replace('<uses-permission android:name="com.android.vending.BILLING" tools:node="remove"/>', '')
          open(p, "w").write(s)
          print("Play manifest: BILLING permission kept (merged from in_app_purchase)")
          # ---- /pay1 ----
          PY
          # 2) Build the bundle (all ABIs; Play serves each phone its own split).
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }} \
            --dart-define=API_BASE="${{ github.event.inputs.api_base || 'https://api.lifeassisto.com' }}" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%MZ)" \
            --dart-define=PLAY_STORE=true
          AAB=build/app/outputs/bundle/release/app-release.aab
          # the bundle's own (protobuf) manifest keeps permission names as text
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > /tmp/play-manifest.pb
          if grep -a -q REQUEST_INSTALL_PACKAGES /tmp/play-manifest.pb; then
            echo "::error::REQUEST_INSTALL_PACKAGES still in the Play bundle manifest"; exit 1
          fi
          # ---- pay1 ---- Play Billing needs the BILLING permission in the bundle
          if ! grep -a -q com.android.vending.BILLING /tmp/play-manifest.pb; then
            echo "::error::com.android.vending.BILLING missing from the Play bundle manifest"; exit 1
          fi
          # ---- /pay1 ----
          # 3) Pick the key: Play upload key if configured, else the release key.
          if [ -n "${UP_KS_B64:-}" ]; then
            printf '%s' "$UP_KS_B64" | base64 -d > /tmp/aab.p12
            export SP="$UP_KS_PASS" KP="$UP_KEY_PASS"; ALIAS="$UP_ALIAS"; WHICH="play-upload-key"
          else
            printf '%s' "$REL_KS_B64" | base64 -d > /tmp/aab.p12
            export SP="$REL_KS_PASS" KP="$REL_KEY_PASS"; ALIAS="$REL_ALIAS"; WHICH="release-key"
          fi
          # 4) Flutter's template signs release with the DEBUG key; strip that
          #    signature, then sign with jarsigner (the tool Google documents for
          #    .aab — apksigner is for APKs). Passwords via env, never argv.
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.EC' \
              'META-INF/*.DSA' 'META-INF/MANIFEST.MF' 2>/dev/null || true
          jarsigner -keystore /tmp/aab.p12 -storetype PKCS12 \
            -storepass:env SP -keypass:env KP -digestalg SHA-256 \
            "$AAB" "$ALIAS" > /dev/null
          jarsigner -verify "$AAB" | tail -1
          echo "signed with: $WHICH"
          keytool -printcert -jarfile "$AAB" | grep -E 'Owner:|SHA256:' | head -2   # public cert info only
          rm -f /tmp/aab.p12
          mkdir -p out
          cp "$AAB" "out/assisto-play-build${{ github.run_number }}.aab"
          ls -la out/*.aab

      - name: Upload AAB artifact (Google Play)
        if: steps.aab.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: assisto-aab
          path: app/out/*.aab
          retention-days: 30
      # ---- /l1-launch ----

  # Install the RELEASE APK on real Android emulators and prove it OPENS without
  # an ANR or crash within 60s. The whole run fails if this fails, so ship_watch
  # never publishes a broken-launch build. (Added after the build-99 launch ANR.)
  launch-smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    # A hung adb call once held runs for 6h (builds 145/146: `adb logcat -d`
    # never returned). Healthy runs finish in ~5 min; cap the job.
    timeout-minutes: 40
    # Launch-safety gate: cold-start + open every native feature (the __tour__)
    # on an emulator. We test API 33 = the owner's Android 13 phone (the critical
    # target). API 30 was dropped from the gate: its x86_64 CI emulator kept
    # CRASHING the hosted runner (job 'cancelled', which continue-on-error cannot
    # salvage) and blocked 3 consecutive publishes (builds 110-112). API 33 passes
    # the identical tour reliably, and the owner also confirms launch on the real
    # Realme 9i (Android 13). Older-Android (API 30) CI coverage is PAUSED until a
    # stable emulator config is found — tracked in STATUS_FOR_OWNER.md.
    strategy:
      fail-fast: false
      matrix:
        api: [33]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assisto-apk-emu
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch smoke test (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          # google_apis is the image that reliably boots headless on CI (every
          # build 102-108 reached LAUNCH OK on it within minutes). The AOSP
          # 'default' image hung >2h without booting. The GMS thrash only ever
          # hurt REPEATED relaunches — the single-cold-start __tour__ below does
          # one launch, so google_apis is both reliable and sufficient.
          target: google_apis
          profile: pixel_5
          disable-animations: true
          # Fail fast if an emulator can't boot (a flaky API-30 boot once dragged
          # a run past 30min). 8min is well above a healthy google_apis boot.
          emulator-boot-timeout: 480
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # NOTE: this script runs under /bin/sh in the runner — use only
          # &&/|| one-liners (multi-line if/then/fi breaks it).
          script: |
            # GATE (owner rule 22 Oct: max 1 h on CI problems): RELEASE build, real cold
            # start, alive after 30 s, no crash/ANR, settings store works. The native
            # feature TOUR is OFF while the hosted emulator wedges adb during it (it froze
            # build 150's unchanged code too) -- re-enable when CI is stable.
            sleep 60
            adb install -r apk/*.apk || { echo "install failed"; exit 1; }
            adb shell pm grant com.assisto.assisto android.permission.POST_NOTIFICATIONS 2>/dev/null || true
            timeout 60 adb logcat -c || true
            nohup sh -c 'adb logcat -v time > /tmp/live_logcat.txt 2>&1' >/dev/null 2>&1 &
            adb shell monkey -p com.assisto.assisto -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || adb shell am start -n com.assisto.assisto/com.assisto.assisto.MainActivity
            sleep 30
            timeout 30 adb shell pidof com.assisto.assisto > pid.txt 2>/dev/null || true
            sleep 3
            cp /tmp/live_logcat.txt live_logcat.txt 2>/dev/null || true
            cp live_logcat.txt logcat.txt 2>/dev/null || true
            echo "live logcat lines: $(wc -l < live_logcat.txt 2>/dev/null || echo 0)"
            grep -E "FATAL EXCEPTION|ANR in com.assisto|com.assisto.assisto.*has died|FATAL SIGNAL|AndroidRuntime.*com.assisto|E/flutter.*(Unhandled|Fatal)" logcat.txt > crashes.txt 2>/dev/null || true
            test ! -s crashes.txt || { echo "::error::CRASH/ANR during the release cold start on API ${{ matrix.api }}"; cat crashes.txt; exit 1; }
            if grep -q "ASSISTO_PREFS_FAIL" logcat.txt; then echo "::error::settings store (SharedPreferences) failed in the release build"; grep "ASSISTO_PREFS_FAIL" logcat.txt | head -3; exit 1; fi
            grep -q "Displayed com.assisto.assisto/.MainActivity" logcat.txt || { echo "::error::MainActivity was never displayed"; exit 1; }
            test -s pid.txt || { echo "::error::app NOT running 30 s after a release cold start on API ${{ matrix.api }}"; exit 1; }
            echo "RELEASE COLD START OK on API ${{ matrix.api }} pid=$(cat pid.txt)"
      - name: Upload smoke logcat (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logcat-${{ matrix.api }}
          path: |
            live_logcat.txt
            logcat.txt
          retention-days: 7
          if-no-files-found: warn
