name: Build Assisto APK

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend base URL baked into the app"
        required: false
        default: "https://assisto.asalify.com"
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/android.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --project-name assisto --org com.assisto --platforms=android .

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build debug APK (installable / debug-signed)
        working-directory: app
        run: |
          API_BASE="${{ github.event.inputs.api_base || 'https://assisto.asalify.com' }}"
          flutter build apk --debug --dart-define=API_BASE="$API_BASE"

      - name: Rename APK with build number
        working-directory: app
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "out/assisto-part1-build${{ github.run_number }}.apk"
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: assisto-apk
          path: app/out/*.apk
          retention-days: 14
