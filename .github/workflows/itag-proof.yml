# itag-proof (18 Nov): the phone's iTag Bluetooth link code, proven on a plain
# JVM — no phone, no emulator, ~3 min.
#  1. ItagEngine.kt (pure Kotlin link brain: serialized GATT ops, timeouts,
#     GATT-133 retry, link loss, Bluetooth off, reconnect) + JUnit 4 tests
#     with a fake GATT and a virtual clock (tools/itag/ItagEngineTest.kt).
#  2. ItagChannel.kt (the Android adapter) compiled against the REAL
#     android.jar (+ compile-only Flutter stand-ins) — a Kotlin error here
#     is caught without a 40-minute APK build.
name: iTag proof (JVM)
on:
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
    paths:
      - "app/android_overlay/app/src/main/kotlin/com/assisto/assisto/itag/**"
      - "tools/itag/**"
      - ".github/workflows/itag-proof.yml"
concurrency:
  group: itag-proof-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Tools (kotlinc 2.1.0, JUnit 4.13.2)
        run: |
          set -euo pipefail
          mkdir -p /tmp/k && cd /tmp/k
          curl -sSfL -o kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          unzip -q kc.zip
          curl -sSfL -o junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -sSfL -o hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Unit tests — ItagEngine with a fake GATT
        run: |
          set -euo pipefail
          K=app/android_overlay/app/src/main/kotlin/com/assisto/assisto/itag
          /tmp/k/kotlinc/bin/kotlinc "$K/ItagEngine.kt" tools/itag/ItagEngineTest.kt \
            -cp /tmp/k/junit.jar -d /tmp/k/tests.jar 2>&1 | grep -v '^warning' || true
          test -f /tmp/k/tests.jar
          java -cp /tmp/k/tests.jar:/tmp/k/junit.jar:/tmp/k/hamcrest.jar:/tmp/k/kotlinc/lib/kotlin-stdlib.jar \
            org.junit.runner.JUnitCore com.assisto.assisto.itag.ItagEngineTest | tee itag_jvm_tests.txt
          grep -q '^OK (' itag_jvm_tests.txt
      - name: Compile ItagChannel.kt against the real android.jar
        run: |
          set -euo pipefail
          AJ=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | tail -1)/android.jar
          echo "android.jar: $AJ" | tee itag_compile.txt
          K=app/android_overlay/app/src/main/kotlin/com/assisto/assisto/itag
          /tmp/k/kotlinc/bin/kotlinc "$K/ItagChannel.kt" "$K/ItagEngine.kt" tools/itag/flutter_stub/FlutterStub.kt \
            -cp "$AJ" -d /tmp/k/channel.jar 2>&1 | tee -a itag_compile.txt
          test -f /tmp/k/channel.jar
          ! grep -q 'error:' itag_compile.txt
          echo "ItagChannel.kt compiled OK" | tee -a itag_compile.txt
      - name: Summary
        if: always()
        run: |
          { echo "## iTag JVM proof"; echo '```'; tail -25 itag_jvm_tests.txt 2>/dev/null; tail -3 itag_compile.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: itag-jvm-proof
          path: |
            itag_jvm_tests.txt
            itag_compile.txt
          retention-days: 7
