# lpaudio: IELTS listening audio, rendered here (never on the server) with
# Kokoro-82M v1.0 (Apache-2.0, stock voices, no cloning), published as assets of
# the GitHub release "lp-audio" (content-addressed names; parts already in the
# release are not rendered again). The server attaches them with
# `manage.py lp_audio` (sha256-checked, private media, signed links).
name: lp-audio

on:
  push:
    branches: ['ci/lpaudio**']
    paths: ['tools/lp/audio/**', 'tools/lp/content/**', 'backend/core/logic/lp_audio.py',
            '.github/workflows/lp-audio.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to the lp-audio release'
        type: boolean
        default: true

concurrency:
  group: lp-audio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan (no TTS) — every part has voices and a file name
        run: |
          python tools/lp/audio/render.py --out out/plan --plan-only
          python -m unittest discover -s tools/lp/audio -p 'test_*.py' -v
      - name: Previous release manifest (skip parts already rendered)
        run: |
          mkdir -p prev
          gh release download lp-audio -p manifest.json -D prev --clobber 2>/dev/null || echo "no release yet"
      - name: System packages (ffmpeg = AAC encoder; eSpeak NG = Kokoro G2P fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-kokoro-v1
      - name: Python deps (pinned)
        run: |
          python -m pip install -q "numpy==1.26.4" "soundfile==0.12.1"
          python -m pip install -q --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.4.1" "kokoro==0.9.4" "misaki[en]==0.9.4"
      - name: Japanese + Chinese G2P (best effort; a language that fails stays on the phone voice)
        continue-on-error: true
        run: |
          python -m pip install -q "misaki[zh]==0.9.4" || echo "zh G2P not installed"
          python -m pip install -q "misaki[ja]==0.9.4" && python -m unidic download || echo "ja G2P not installed"
      - name: Render (Kokoro-82M, CPU)
        run: python tools/lp/audio/render.py --out out/lp_audio --have prev/manifest.json
      - name: Verify files (duration, size, AAC)
        run: |
          python - <<'EOF'
          import json, os, subprocess
          m = json.load(open("out/lp_audio/manifest.json"))
          new = [l.strip() for l in open("out/lp_audio/rendered.txt") if l.strip()]
          ielts = [e for e in m["parts"] if e["bundle"].startswith("ielts-")]
          assert len(ielts) >= 12, "expected 3 mocks x 4 parts"
          for e in m["parts"]:
              lo, hi = (60, 1200) if e in ielts else (1, 300)
              assert lo < e["duration_sec"] < hi, e
              assert e["bytes"] < 8 * 1024 * 1024, e
          print("track clips:", len(m["parts"]) - len(ielts))
          for f in new:
              p = os.path.join("out/lp_audio", f)
              r = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "stream=codec_name,channels",
                                  "-of", "json", p], capture_output=True, text=True, check=True)
              s = json.loads(r.stdout)["streams"][0]
              assert s["codec_name"] == "aac" and s["channels"] == 1, (f, s)
          print("ok", len(m["parts"]), "parts;", len(new), "new;",
                round(sum(e["bytes"] for e in m["parts"]) / 1e6, 1), "MB;",
                round(sum(e["duration_sec"] for e in m["parts"]) / 60, 1), "min")
          EOF
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # storage quota never fails a green render
        with:
          name: lp-audio
          path: out/lp_audio
          retention-days: 14
      - name: Publish to the lp-audio release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          gh release view lp-audio >/dev/null 2>&1 || gh release create lp-audio \
            --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Language Partner listening audio (original IELTS practice tests)" \
            --notes "Synthetic speech by Kokoro-82M v1.0 (Apache-2.0) stock voices; no voice cloning. Original Assisto practice content — not official IELTS material."
          new=$(sed 's#^#out/lp_audio/#' out/lp_audio/rendered.txt)
          if [ -n "$new" ]; then gh release upload lp-audio $new --clobber; fi
          gh release upload lp-audio out/lp_audio/manifest.json --clobber
          head -c 3000 out/lp_audio/manifest.json
