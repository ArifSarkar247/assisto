# lpaudio: IELTS + course listening audio, rendered here (never on the server) with
# Kokoro-82M v1.0 (Apache-2.0, stock voices, no cloning), published to a DRAFT
# (non-public) release lp-audio-staging-<run> (content-addressed names; parts already
# in the newest draft are not rendered again). The server fetches it with its
# authenticated gh: `manage.py lp_audio` (sha256 + script check, private media, signed links).
name: lp-audio

on:
  push:
    branches: ['ci/lpaudio**']
    paths: ['tools/lp/audio/**', 'tools/lp/content/**', 'backend/core/logic/lp_audio.py',
            '.github/workflows/lp-audio.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to the lp-audio release'
        type: boolean
        default: true

concurrency:
  group: lp-audio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Plan (no TTS) — every part has voices and a file name
        run: |
          python tools/lp/audio/render.py --out out/plan --plan-only
          python -m unittest discover -s tools/lp/audio -p 'test_*.py' -v
      - name: Previous audio (newest DRAFT staging release; never re-render a part that exists)
        run: |
          mkdir -p prev out/lp_audio
          prev=$(gh release list --limit 50 --json tagName,isDraft,createdAt \
            -q '[.[] | select(.isDraft and (.tagName|startswith("lp-audio-staging-")))] | sort_by(.createdAt) | last | .tagName // ""')
          # one-time seed: the first render went to a public release "lp-audio" (deleted after the move)
          [ -z "$prev" ] && gh release view lp-audio >/dev/null 2>&1 && prev=lp-audio
          echo "previous: ${prev:-none}"
          if [ -n "$prev" ]; then
            gh release download "$prev" -D out/lp_audio --clobber
            cp out/lp_audio/manifest.json prev/manifest.json
          fi
      - name: System packages (ffmpeg = AAC encoder; eSpeak NG = Kokoro G2P fallback)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng libsndfile1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-kokoro-v1
      - name: Python deps (pinned)
        run: |
          python -m pip install -q "numpy==1.26.4" "soundfile==0.12.1"
          python -m pip install -q --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==2.4.1" "transformers==4.46.3" "kokoro==0.9.4" "misaki[en]==0.9.4"
      - name: Japanese + Chinese G2P (best effort; a language that fails stays on the phone voice)
        continue-on-error: true
        run: |
          python -m pip install -q "misaki[zh]==0.9.4" || echo "zh G2P not installed"
          python -m pip install -q "misaki[ja]==0.9.4" && python -m unidic download || echo "ja G2P not installed"
      - name: Render (Kokoro-82M, CPU)
        run: python tools/lp/audio/render.py --out out/lp_audio --have prev/manifest.json
      - name: Verify files (duration, size, AAC)
        run: |
          python - <<'EOF'
          import json, os, subprocess
          m = json.load(open("out/lp_audio/manifest.json"))
          new = [l.strip() for l in open("out/lp_audio/rendered.txt") if l.strip()]
          ielts = [e for e in m["parts"] if e["bundle"].startswith("ielts-")]
          assert len(ielts) >= 12, "expected 3 mocks x 4 parts"
          for e in m["parts"]:
              lo, hi = (60, 1200) if e in ielts else (1, 300)
              assert lo < e["duration_sec"] < hi, e
              assert e["bytes"] < 8 * 1024 * 1024, e
          print("track clips:", len(m["parts"]) - len(ielts))
          for f in new:
              p = os.path.join("out/lp_audio", f)
              r = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "stream=codec_name,channels",
                                  "-of", "json", p], capture_output=True, text=True, check=True)
              s = json.loads(r.stdout)["streams"][0]
              assert s["codec_name"] == "aac" and s["channels"] == 1, (f, s)
          print("ok", len(m["parts"]), "parts;", len(new), "new;",
                round(sum(e["bytes"] for e in m["parts"]) / 1e6, 1), "MB;",
                round(sum(e["duration_sec"] for e in m["parts"]) / 60, 1), "min")
          EOF
      - uses: actions/upload-artifact@v4
        continue-on-error: true  # storage quota never fails a green render
        with:
          name: lp-audio
          path: out/lp_audio
          retention-days: 14
      - name: Publish to a NON-PUBLIC draft release lp-audio-staging-<run> (server fetches it with gh)
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          tag="lp-audio-staging-${GITHUB_RUN_ID}"
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Language Partner listening audio (staging, not public)" \
            --notes "Draft = not public. Kokoro-82M v1.0 (Apache-2.0) stock voices; no voice cloning. Server: manage.py lp_audio"
          files=$(python3 -c 'import json; m=json.load(open("out/lp_audio/manifest.json")); print(" ".join("out/lp_audio/"+e["file"] for e in m["parts"]))')
          gh release upload "$tag" $files out/lp_audio/manifest.json --clobber
          echo "published draft $tag ($(echo $files | wc -w) clips)"
          # keep the two newest drafts (rollback), drop older ones
          gh release list --limit 50 --json tagName,isDraft,createdAt \
            -q '[.[] | select(.isDraft and (.tagName|startswith("lp-audio-staging-")))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' \
            | while read -r old; do [ -n "$old" ] && gh release delete "$old" -y || true; done
