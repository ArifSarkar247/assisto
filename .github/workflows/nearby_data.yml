# nearby (owner 3 Nov 18:50): Assisto's OWN emergency-place list.
# ALL downloading and filtering happens here, never on the server (owner:
# one 96 GB disk, 7.8 GB RAM, no data processing on the box).
#   * Geofabrik per-country/region OpenStreetMap extracts, one at a time,
#     monthly (their guidance: no parallel hammering, no needless re-downloads);
#   * osmium keeps ONLY hospital, clinic, pharmacy, police, fire station,
#     ambulance station; deploy/nearby/build_extract.py writes compact
#     per-country gzip JSON (id, category, name, name:en, lat, lon, phone) with
#     the ODbL attribution;
#   * the files are published as assets of the `nearby-data` release (and a
#     workflow artifact); the server's `manage.py nearby_import` (inside
#     minute_jobs, no new cron line) pulls only these small files.
# Rollout order (owner): BD, then SA, AE, MY, QA, OM, KW, SG, IT, GB, US.
# World (continent extracts) only on manual dispatch with set=world, or
# monthly when the repo variable NEARBY_WORLD is '1'. Never the planet file.
name: nearby-data

on:
  schedule:
    - cron: '17 2 3 * *'      # monthly, the 3rd, 02:17 UTC
  workflow_dispatch:
    inputs:
      set:
        description: 'rollout | world | codes from the rollout list, e.g. BD or SA,AE'
        required: true
        default: 'rollout'
  # one-time first build from the agent branch (only when this file changes)
  push:
    branches: ['ci/nearby-arb']
    paths: ['.github/workflows/nearby_data.yml']

concurrency:
  group: nearby-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (big extracts like the US need ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools (osmium, shapely)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool jq
          python -m pip install -q 'shapely==2.0.6'
          osmium --version | head -1
      - name: Inputs (country polygons, previous manifest)
        run: |
          mkdir -p nearby_work
          # Natural Earth admin-0 (public domain) for point -> country
          curl -fsSL -o nearby_work/ne_admin0.geojson \
            https://raw.githubusercontent.com/nvkelso/natural-earth-vector/v5.1.2/geojson/ne_10m_admin_0_countries.geojson \
          || curl -fsSL -o nearby_work/ne_admin0.geojson \
            https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_admin_0_countries.geojson
          curl -fsSL -o nearby_work/manifest_prev.json \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/nearby-data/manifest.json" \
            || echo '{}' > nearby_work/manifest_prev.json
      - name: Build per-country files
        env:
          SET_IN: ${{ github.event.inputs.set }}
          EVENT: ${{ github.event_name }}
          WORLD: ${{ vars.NEARBY_WORLD }}
        run: |
          SET="$(printf '%s' "${SET_IN:-rollout}" | tr -cd 'A-Za-z,')"
          if [ -z "$SET" ]; then SET=rollout; fi
          bash deploy/nearby/ci_run.sh "$SET" "$PWD/nearby_work"
          if [ "$EVENT" = "schedule" ] && [ "$WORLD" = "1" ]; then
            bash deploy/nearby/ci_run.sh world "$PWD/nearby_work"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nearby-data
          path: |
            nearby_work/out/nearby_*.json.gz
            nearby_work/out/manifest.json
          retention-days: 35
      - name: Publish release assets (manifest last)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nearby-data >/dev/null 2>&1 || gh release create nearby-data \
            --prerelease --title "Nearby emergency places (OpenStreetMap, ODbL)" \
            --notes "Monthly per-country emergency places (hospital, clinic, pharmacy, police, fire, ambulance) filtered from Geofabrik OpenStreetMap extracts. Data (c) OpenStreetMap contributors, available under the Open Database License (ODbL 1.0): https://www.openstreetmap.org/copyright"
          gh release upload nearby-data nearby_work/out/nearby_*.json.gz --clobber
          gh release upload nearby-data nearby_work/out/manifest.json --clobber
          cat nearby_work/out/manifest.json | head -c 4000
