# Owner-run, manual: encrypted backup of the Android release keystore + its
# alias/passwords (the keystore exists ONLY in GitHub secrets).
# The bundle is encrypted INSIDE the runner with AES-256 (gpg --symmetric) using
# KEY_BACKUP_PASSPHRASE, a secret only the owner sets (gh secret set prompts with
# hidden input). Only the ENCRYPTED file is uploaded, kept 1 day; the integrator
# downloads it to the server and deletes the artifact. Nothing is ever committed.
name: Keystore backup (encrypted, manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Encrypt keystore bundle
        env:
          PASS: ${{ secrets.KEY_BACKUP_PASSPHRASE }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${PASS:-}" ] || [ ${#PASS} -lt 12 ]; then
            echo "::error::set KEY_BACKUP_PASSPHRASE (12+ characters) first: gh secret set KEY_BACKUP_PASSPHRASE"; exit 1
          fi
          W=$(mktemp -d)
          printf '%s' "$KS_B64" | base64 -d > "$W/assisto-release.p12"
          {
            echo "Assisto Android release keystore — KEEP OFFLINE"
            echo "file: assisto-release.p12 (PKCS12)"
            echo "alias: $KS_ALIAS"
            echo "store password: $KS_PASS"
            echo "key password: $KEY_PASS"
            echo "created by CI run ${{ github.run_id }} on $(date -u +%FT%TZ)"
          } > "$W/KEYSTORE_INFO.txt"
          keytool -list -v -storetype PKCS12 -keystore "$W/assisto-release.p12" -storepass "$KS_PASS" \
            | grep -E "Alias name|Valid from|SHA256:|Signature algorithm|Key Algorithm" | sed 's/^/  /' >> "$W/KEYSTORE_INFO.txt" || true
          tar -C "$W" -czf "$W/bundle.tgz" assisto-release.p12 KEYSTORE_INFO.txt
          mkdir -p out
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o out/assisto-keystore-backup.tgz.gpg "$W/bundle.tgz"
          shred -u "$W"/* 2>/dev/null || rm -f "$W"/*
          ls -la out
          sha256sum out/assisto-keystore-backup.tgz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: out/assisto-keystore-backup.tgz.gpg
          retention-days: 1
