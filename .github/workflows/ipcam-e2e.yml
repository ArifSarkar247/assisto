name: Guard Box E2E (IP camera + old phone, emulator)

# cctvbox (owner CCTV order 9 Nov, item 5 / V3 A4): the switch guard_box_mode
# goes ON only after this run is green. Real RTSP camera (mediamtx + a looped
# synthetic scene with a public-domain person photo) on the runner, the real
# app code on an API 33 emulator: pair -> RTSP -> native MediaCodec decode ->
# motion + on-phone person check -> alert with photo -> owner live view
# (aiortc viewer <- JPEG pictures over the WebRTC data channel).
# No secrets; throw-away sqlite Django; made-up sample data.
on:
  workflow_dispatch:
  push:
    branches: ["ci/cctvbox-arb", "ci/cctvbox-e2e"]

concurrency:
  group: ipcam-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      E2E_DIR: /tmp/assisto-ipcam-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk (the emulator image needs ~8 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          df -h / | tail -1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend deps + aiortc (owner-side live probe) + opencv (scene)
        run: python -m pip install -q -r backend/requirements.txt pyyaml aiortc==1.9.0 opencv-python-headless==4.10.0.84 numpy
      - name: RTSP camera + Django + control server (host side)
        run: bash tools/e2e/ipcam_e2e_up.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'  # tools/ci/flutter_version.txt
          channel: stable
          cache: true
      - name: Add integration_test (CI-only dev dep)
        working-directory: app
        run: |
          python3 - <<'PY'
          p = "pubspec.yaml"
          s = open(p).read()
          if "integration_test:" not in s:
              s = s.replace("dev_dependencies:\n  flutter_test:\n    sdk: flutter\n",
                            "dev_dependencies:\n  flutter_test:\n    sdk: flutter\n"
                            "  integration_test:\n    sdk: flutter\n", 1)
              assert "integration_test:" in s, "dev_dependencies block not found"
          open(p, "w").write(s)
          PY
      - name: Replay android.yml build prep
        run: python3 tools/reality/replay_android_steps.py
      - name: Debug-only cleartext to the in-runner backend
        working-directory: app
        run: |
          python3 - <<'PY'
          p = "android/app/src/debug/AndroidManifest.xml"
          s = open(p).read()
          if "usesCleartextTraffic" not in s:
              s = s.replace("</manifest>",
                  '    <application android:usesCleartextTraffic="true">\n'
                  '        <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false"/>\n'
                  '    </application>\n</manifest>', 1)
              open(p, "w").write(s)
          PY
          python3 "$GITHUB_WORKSPACE/tools/ci/raise_plugin_compile_sdk.py" 36
      - name: Build the x86_64 debug test APK
        working-directory: app
        run: |
          timeout 1800 flutter build apk --debug --target-platform=android-x64 \
            --target=integration_test/ipcam_guard_e2e_test.dart \
            --dart-define=REALITY_API_BASE=http://10.0.2.2:18700 \
            --dart-define=IPCAM_CTL=http://10.0.2.2:18799
          (cd android && timeout 60 ./gradlew --stop) || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Guard Box flow on API 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 480
          ram-size: 3072M
          cores: 3
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/e2e/ipcam_emu_run.sh
      - name: Proof (DB + live probe)
        if: always()
        run: |
          python3 tools/e2e/ipcam_ctl.py check || echo "::error::no Guard Box alert with photo in the DB"
          grep -h "IPCAM_E2E" "$E2E_DIR/flutter_test.log" 2>/dev/null | sed 's/^.*IPCAM_E2E/IPCAM_E2E/' | tee "$E2E_DIR/app_steps.txt" || true
          {
            echo "### Guard Box E2E (IP camera + old phone, emulator API 33)"
            echo '```'
            cat "$E2E_DIR/app_steps.txt" 2>/dev/null
            grep -h "ALERT_WITH_PHOTO" "$E2E_DIR"/*.log 2>/dev/null || true
            python3 -c "import json;d=json.load(open('$E2E_DIR/ipcam_proof.json'));print('events:',[(e['type'],e['source'],e['detector'],e['snapshot']) for e in d['events']]);print('live:',d['live'])" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 -c "import json,sys;d=json.load(open('$E2E_DIR/ipcam_proof.json'));sys.exit(0 if d['alert_with_photo'] and d['live_pictures_ok'] else 1)"
      - name: Upload evidence
        continue-on-error: true  # ghstore: storage quota never fails a green build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipcam-e2e-evidence
          path: |
            /tmp/assisto-ipcam-e2e/*.log
            /tmp/assisto-ipcam-e2e/*.json
            /tmp/assisto-ipcam-e2e/*.txt
            /tmp/assisto-ipcam-e2e/*.jpg
            /tmp/assisto-ipcam-e2e/media/shop/**
          retention-days: 2
          if-no-files-found: warn
